  <script>
    // Fail-safe: Guarantee loading overlay vanishes instantly so screen is never stuck
    (function() {
      function hideLoader() {
        var loader = document.getElementById('loading-screen');
        if (loader && loader.style.display !== 'none') {
          loader.style.opacity = '0';
          loader.style.pointerEvents = 'none';
          setTimeout(function() { loader.style.display = 'none'; }, 400);
        }
      }
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        setTimeout(hideLoader, 300);
      } else {
        window.addEventListener('DOMContentLoaded', function() { setTimeout(hideLoader, 300); });
      }
      setTimeout(hideLoader, 1000); // Absolute fallback limit
    })();
  </script>

                      className={`w-2 h-2 rounded-full transition-all ${i === testimonialIdx ? 'bg-marie-gold w-6' : (darkMode ? 'bg-white/20' : 'bg-zinc-300')}`}
                    ></button>
                  ))}
                  <button
                    onClick={() => setTestimonialIdx(Math.min(testimonials.length - 1, testimonialIdx + 1))}
                    className={`w-10 h-10 rounded-full flex items-center justify-center border transition-all ${testimonialIdx === testimonials.length - 1 ? 'opacity-30 cursor-default' : 'hover:border-marie-gold hover:text-marie-gold'} ${darkMode ? 'border-white/20 text-zinc-400' : 'border-marie-border text-zinc-500'}`}
                  >
                    <i data-lucide="chevron-right" className="w-4 h-4"></i>
                  </button>
                </div>
              </div>
            </div>
          </section>

          {/* ══════════════════════════════════════════════════════════
               SPEAKING PORTFOLIO SECTION
          ══════════════════════════════════════════════════════════ */}
          <section id="speaking" className={`py-24 border-t ${darkMode ? 'bg-[#0D0C14] border-white/10' : 'bg-white border-marie-border'}`}>
            <div className="max-w-7xl mx-auto px-6 sm:px-12">
              <div className="grid grid-cols-1 lg:grid-cols-5 gap-12 items-start">
                {/* Left — Header + CTA */}
                <div className="lg:col-span-2 reveal-on-scroll">
                  <div className="text-xs font-bold text-marie-gold uppercase tracking-widest mb-3">KEYNOTES & PANELS</div>
                  <h2 className="text-4xl sm:text-5xl font-bold mb-4">Speaking Portfolio</h2>
                  <div className="section-divider mb-5"></div>
                  <p className={`text-sm leading-relaxed mb-8 ${darkMode ? 'text-zinc-400' : 'text-zinc-600'}`}>
                    Yash has delivered keynotes, panels, and workshops at some of India's most prestigious corporate, startup, and academic platforms — from Meta and Google to IIM Ahmedabad and Economic Times.
                  </p>

                  {/* Stats */}
                  <div className="grid grid-cols-2 gap-4 mb-8">
                    {[
                      { val: '50+', label: 'Total Events' },
                      { val: '20+', label: 'Corporates' },
                      { val: '15+', label: 'Colleges & B-Schools' },
                      { val: '10K+', label: 'Audience Reached' },
                    ].map((s) => (
                      <div key={s.label} className={`p-4 rounded-2xl text-center ${cardClass}`}>
                        <div className="text-2xl font-bold text-marie-gold">{s.val}</div>
                        <div className={`text-xs mt-1 ${darkMode ? 'text-zinc-400' : 'text-zinc-500'}`}>{s.label}</div>
                      </div>
                    ))}
                  </div>

                  {/* Book CTA */}
                  <div className={`p-6 rounded-3xl border-2 border-marie-gold space-y-4 ${darkMode ? 'bg-marie-gold/5' : 'bg-marie-goldSoft'}`}>
                    <div className="text-sm font-bold text-marie-gold">BOOK YASH FOR YOUR EVENT</div>
                    <p className={`text-xs leading-relaxed ${darkMode ? 'text-zinc-300' : 'text-zinc-600'}`}>
                      Available for keynotes, workshops, fireside chats, and panel discussions on Growth Marketing, Personal Branding, AI in Marketing, and Startup Scaling.
                    </p>
                    <a
                      href="mailto:yash@meagarwalyash.com?subject=Speaking Enquiry"
                      className="flex items-center gap-2 px-6 py-3 rounded-full bg-marie-gold hover:bg-marie-goldHover text-black font-bold text-xs transition-all shadow-md w-fit"
                    >
                      <i data-lucide="mic" className="w-3.5 h-3.5"></i>
                      <span>Book a Speaking Engagement →</span>
                    </a>
                  </div>
                </div>

                {/* Right — Events List */}
                <div className="lg:col-span-3 space-y-3 reveal-on-scroll">
                  {speakingEvents.map((ev) => (
                    <div key={ev.id} className={`${cardClass} rounded-2xl p-5 flex items-start gap-4 group hover:border-marie-gold/50 transition-all`}>
                      <div className="w-10 h-10 rounded-xl bg-marie-gold/15 flex items-center justify-center flex-shrink-0 group-hover:bg-marie-gold/25 transition-colors">
                        <i data-lucide={ev.icon} className="w-4 h-4 text-marie-gold"></i>
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="flex flex-wrap items-center gap-2 mb-1">
                          <span className="text-xs font-bold px-2 py-0.5 rounded-full bg-marie-gold/20 text-marie-gold uppercase">{ev.type}</span>
                          <span className={`text-[11px] font-bold ${darkMode ? 'text-zinc-500' : 'text-zinc-400'}`}>{ev.year}</span>
                          {ev.featured && <span className="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 font-bold">FEATURED</span>}
                        </div>
                        <div className="font-bold text-sm mb-0.5">{ev.event}</div>
                        <div className={`text-[11px] font-bold mb-1 ${darkMode ? 'text-zinc-400' : 'text-zinc-500'}`}>{ev.org}</div>
                        <div className={`text-xs ${darkMode ? 'text-zinc-500' : 'text-zinc-400'}`}>{ev.topic}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </section>

          {/* ══════════════════════════════════════════════════════════
               NEWSLETTER — PREMIUM SIGNUP
          ══════════════════════════════════════════════════════════ */}
          <section id="newsletter" className={`py-20 border-t relative overflow-hidden ${darkMode ? 'bg-[#0A090E] border-white/10' : 'bg-[#FAF8F5] border-marie-border'}`}>
            <div className="absolute inset-0 pointer-events-none">
              <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[700px] h-[400px] bg-marie-gold/5 rounded-full blur-[120px]"></div>
            </div>
            <div className="max-w-3xl mx-auto px-6 sm:px-12 text-center relative z-10 reveal-on-scroll">
              <div className="text-xs font-bold text-marie-gold uppercase tracking-widest mb-3">EXECUTIVE INTELLIGENCE</div>
              <h2 className="text-4xl sm:text-5xl font-bold mb-4">The MAY Growth Dispatch</h2>
              <div className="section-divider mx-auto mb-5"></div>
              <p className={`text-base max-w-xl mx-auto leading-relaxed mb-2 ${darkMode ? 'text-zinc-300' : 'text-zinc-600'}`}>
                High-signal, low-noise insights on Growth Marketing, AI, Personal Branding, and Enterprise Strategy — delivered fortnightly to 10,000+ leaders.
              </p>

              {/* Feature Tags */}
              <div className="flex flex-wrap justify-center gap-2 mb-8">
                {['No Fluff', 'Actionable Frameworks', 'Real Case Studies', 'AI Tools', 'PR Playbooks'].map(tag => (
                  <span key={tag} className={`px-3 py-1 rounded-full text-xs font-bold ${darkMode ? 'bg-white/10 text-zinc-300 border border-white/10' : 'bg-white border border-marie-border text-zinc-600'}`}>{tag}</span>
                ))}
              </div>

              {newsletterSubmitted ? (
                <div className={`p-8 rounded-3xl border-2 border-marie-gold space-y-3 ${darkMode ? 'bg-marie-gold/10' : 'bg-marie-goldSoft'}`}>
                  <div className="text-3xl font-bold text-marie-gold">✓ Welcome to the Dispatch!</div>
                  <p className={`text-sm ${darkMode ? 'text-zinc-300' : 'text-zinc-600'}`}>You're now part of 10,000+ founders, CMOs, and growth leaders receiving high-signal insights from Yash.</p>
                </div>
              ) : (
                <form onSubmit={handleNewsletterSubmit} className="flex flex-wrap gap-3 justify-center">
                  <input
                    type="email"
                    required
                    placeholder="Enter your best email address"
                    value={newsletterEmail}
                    onChange={(e) => setNewsletterEmail(e.target.value)}
                    className={`px-6 py-4 rounded-full border text-sm placeholder:text-zinc-400 focus:outline-none focus:border-marie-gold flex-1 min-w-[260px] max-w-sm ${darkMode ? 'bg-white/10 border-white/20 text-white' : 'bg-white border-marie-border text-black'}`}
                  />
                  <button type="submit" className="px-8 py-4 rounded-full bg-marie-gold hover:bg-marie-goldHover text-black font-bold text-sm shadow-lg transition-all flex items-center gap-2 animate-pulse-gold">
                    <span>Subscribe Free →</span>
                  </button>
                </form>
              )}
              <p className={`text-xs mt-4 ${darkMode ? 'text-zinc-500' : 'text-zinc-400'}`}>No spam. Unsubscribe anytime. Trusted by 10,000+ growth leaders.</p>
            </div>
          </section>

          {/* CONTACT & FOOTER SIGNATURE BANNER */}
          <section id="contact" className={`py-24 border-t text-center relative overflow-hidden ${darkMode ? 'bg-[#12111A] border-white/10' : 'bg-marie-goldSoft border-marie-border'}`}>
            <div className="absolute inset-0 pointer-events-none">
              <div className="absolute bottom-0 left-0 w-[400px] h-[300px] bg-gradient-to-tr from-marie-gold/8 to-transparent blur-[80px]"></div>
              <div className="absolute top-0 right-0 w-[300px] h-[200px] bg-gradient-to-bl from-marie-gold/6 to-transparent blur-[80px]"></div>
            </div>
            <div className="max-w-4xl mx-auto px-6 space-y-8 reveal-on-scroll relative z-10">
              <span className="text-xs font-bold text-marie-gold uppercase tracking-widest">START A CONVERSATION</span>
              <h2 className="text-4xl sm:text-6xl font-bold">Ready To Build A Growth Engine You Love?</h2>
              <p className={`text-base max-w-xl mx-auto leading-relaxed ${darkMode ? 'text-zinc-300' : 'text-zinc-700'}`}>
                For fractional CMO retainers, private executive advisory, speaking invitations, or press inquiries — reach out directly. Based in Mumbai, working globally.
              </p>

              <div className="flex flex-wrap justify-center gap-4 pt-4">
                <a href="mailto:yash@meagarwalyash.com" className="px-8 py-4 rounded-full bg-marie-gold text-black font-bold text-sm hover:bg-marie-goldHover transition-all shadow-lg flex items-center gap-2 gold-glow">
                  <i data-lucide="mail" className="w-4 h-4"></i>
                  <span>yash@meagarwalyash.com</span>
                </a>
                <a href="https://linkedin.com/in/meagarwalyash" target="_blank" className={`px-8 py-4 rounded-full border font-bold text-sm transition-all flex items-center gap-2 ${darkMode ? 'border-white text-white hover:bg-white hover:text-black' : 'border-marie-border bg-white text-black hover:bg-marie-goldHover hover:text-white'}`}>
                  <i data-lucide="linkedin" className="w-4 h-4"></i>
                  <span>Connect on LinkedIn →</span>
                </a>
              </div>

              {/* Social quick-links */}
              <div className="flex flex-wrap justify-center gap-3 pt-2">
                {[
                  { label: 'LinkedIn', icon: 'linkedin', url: 'https://linkedin.com/in/meagarwalyash' },
                  { label: 'Instagram', icon: 'instagram', url: 'https://instagram.com/meagarwalyash' },
                  { label: 'YouTube', icon: 'youtube', url: 'https://youtube.com/@meagarwalyash' },
                  { label: 'X / Twitter', icon: 'twitter', url: 'https://x.com/meagarwalyash' },
                  { label: 'Threads', icon: 'at-sign', url: 'https://threads.net/@meagarwalyash' },
                ].map(s => (
                  <a key={s.label} href={s.url} target="_blank" title={s.label}
                    className={`w-10 h-10 rounded-full flex items-center justify-center border transition-all hover:border-marie-gold hover:text-marie-gold ${darkMode ? 'border-white/20 text-zinc-400' : 'border-marie-border text-zinc-500'}`}
                  >
                    <i data-lucide={s.icon} className="w-4 h-4"></i>
                  </a>
                ))}
              </div>
            </div>
          </section>

          {/* YOUTUBE INTERACTIVE VIDEO EMBED MODAL */}
          {selectedVideo && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-black/90 backdrop-blur-xl animate-fadeIn">
              <div className={`relative w-full max-w-4xl rounded-3xl overflow-hidden shadow-2xl border ${darkMode ? 'bg-[#14131B] border-white/20' : 'bg-white border-marie-border'}`}>
                
                {/* Header Bar */}
                <div className="p-4 sm:p-6 flex items-center justify-between border-b border-white/10">
                  <div>
                    <span className="text-xs font-bold text-marie-gold uppercase tracking-wider">{selectedVideo.category} • {selectedVideo.episode}</span>
                    <h3 className="text-lg sm:text-xl font-bold line-clamp-1">{selectedVideo.title}</h3>
                  </div>
                  <button
                    onClick={() => setSelectedVideo(null)}
                    className="p-2 rounded-full bg-white/10 hover:bg-white/20 text-white transition-all"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                {/* YouTube Responsive Iframe Player */}
                <div className="aspect-video w-full bg-black relative">
                  <iframe
                    src={`https://www.youtube.com/embed/${selectedVideo.youtubeId}?autoplay=1`}
                    title={selectedVideo.title}
                    className="w-full h-full border-0 absolute inset-0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowFullScreen
                  ></iframe>
                </div>

                {/* Footer Info */}
                <div className="p-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                  <p className={`text-xs max-w-xl ${darkMode ? 'text-zinc-300' : 'text-zinc-600'}`}>{selectedVideo.desc}</p>
                  <a
                    href={selectedVideo.url}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="px-6 py-3 rounded-full bg-marie-gold hover:bg-marie-goldHover text-black font-bold text-xs flex items-center gap-2 whitespace-nowrap shadow-md"
                  >
                    <span>Watch on YouTube</span>
                    <i data-lucide="external-link" className="w-3.5 h-3.5"></i>
                  </a>
                </div>

              </div>
            </div>
          )}

          {/* EXPANDED FOOTER */}
          <footer className={`border-t ${darkMode ? 'bg-black border-white/10 text-zinc-400' : 'bg-white border-marie-border text-zinc-500'}`}>
            <div className="max-w-7xl mx-auto px-6 sm:px-12 py-14">
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-8 mb-10">
                {/* Brand */}
                <div className="col-span-2 sm:col-span-1 space-y-3">
                  <img src="maylogo.png" alt="MAY Logo" className="h-10 w-auto object-contain brightness-150 contrast-125 filter drop-shadow-[0_0_12px_rgba(212,175,55,0.5)]" />
                  <p className="text-xs leading-relaxed">Executive Growth Architect. Author. CMO. Speaker. Built on first principles, not favours.</p>
                  <div className="flex gap-2">
                    {['linkedin', 'instagram', 'youtube', 'twitter'].map(icon => (
                      <a key={icon} href={`https://${icon}.com/meagarwalyash`} target="_blank"
                        className={`w-8 h-8 rounded-lg flex items-center justify-center text-xs transition-all hover:text-marie-gold ${darkMode ? 'bg-white/5 hover:bg-white/10' : 'bg-zinc-100 hover:bg-zinc-200'}`}
                      >
                        <i data-lucide={icon} className="w-3.5 h-3.5"></i>
                      </a>
                    ))}
                  </div>
                </div>

                {/* Sections */}
                <div className="space-y-3">
                  <div className="text-xs font-bold text-marie-gold uppercase tracking-widest">Navigate</div>
                  {[['#impact', 'Impact Dashboard'], ['#journey', 'My Journey'], ['#media', 'Press & Media'], ['#brands', 'Brands'], ['#speaking', 'Speaking']].map(([href, label]) => (
                    <a key={href} href={href} className="block text-xs hover:text-marie-gold transition-colors">{label}</a>
                  ))}
                </div>
                <div className="space-y-3">
                  <div className="text-xs font-bold text-marie-gold uppercase tracking-widest">Work</div>
                  {[['#programs', 'Work With Me'], ['#tv', 'Videos & Podcasts'], ['#book', 'No Godfather'], ['#audit', 'Growth Blueprint'], ['#newsletter', 'Newsletter']].map(([href, label]) => (
                    <a key={href} href={href} className="block text-xs hover:text-marie-gold transition-colors">{label}</a>
                  ))}
                </div>
                <div className="space-y-3">
                  <div className="text-xs font-bold text-marie-gold uppercase tracking-widest">Contact</div>
                  <a href="mailto:yash@meagarwalyash.com" className="block text-xs hover:text-marie-gold transition-colors">yash@meagarwalyash.com</a>
                  <a href="https://linkedin.com/in/meagarwalyash" target="_blank" className="block text-xs hover:text-marie-gold transition-colors">LinkedIn</a>
                  <a href="https://instagram.com/meagarwalyash" target="_blank" className="block text-xs hover:text-marie-gold transition-colors">Instagram</a>
                  <a href="https://youtube.com/@meagarwalyash" target="_blank" className="block text-xs hover:text-marie-gold transition-colors">YouTube Channel</a>
                  <div className={`text-xs mt-2 ${darkMode ? 'text-zinc-600' : 'text-zinc-400'}`}>Mumbai, India 🇮🇳</div>
                </div>
              </div>

              {/* Bottom bar */}
              <div className={`pt-6 border-t flex flex-col sm:flex-row items-center justify-between gap-2 text-xs ${darkMode ? 'border-white/10' : 'border-marie-border'}`}>
                <div>© 2026 Yash Agarwal (@MeAgarwalYash). All Rights Reserved.</div>
                <div className="text-marie-gold font-bold">MUMBAI, INDIA • LIVE IST: {currentTime || '12:00:00 AM'}</div>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
