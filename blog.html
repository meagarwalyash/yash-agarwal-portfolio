                <div className={`p-8 rounded-3xl border-2 text-center shadow-xl ${darkMode ? 'bg-[#14131B] border-white/20' : 'bg-[#FAF8F5] border-zinc-200'}`}>
                  <span className="text-xs font-black text-[#D96B27] bg-[#D96B27]/15 px-3 py-1 rounded-full uppercase">
                    FEATURED BOOK
                  </span>
                  <h4 style={{ color: darkMode ? '#FFFFFF' : '#121212' }} className="font-serif text-xl font-black mt-3">
                    "No Godfather"
                  </h4>
                  <p className="text-xs text-zinc-500 font-bold mt-1">By Yash Agarwal</p>
                  <img src="no godfather cover.png" alt="No Godfather Book" className="h-36 mx-auto my-4 object-contain filter drop-shadow-xl" />
                  <a
                    href="index.html#book"
                    className="inline-block w-full py-3 rounded-full bg-[#A8426C] text-white text-xs font-black uppercase tracking-widest shadow-md hover:scale-105 transition-all"
                  >
                    Get Early Access →
                  </a>
                </div>

                {/* WIDGET 3: TOP READ ESSAYS LIST */}
                <div className={`p-8 rounded-3xl border-2 ${darkMode ? 'bg-[#14131B] border-white/20' : 'bg-white border-zinc-200'}`}>
                  <h4 style={{ color: darkMode ? '#FFFFFF' : '#121212' }} className="font-serif text-xl font-black border-b-2 border-marie-gold/40 pb-3 mb-5">
                    🔥 Most Read Essays
                  </h4>
                  <div className="space-y-4">
                    {blogPosts.slice(0, 4).map((post, idx) => (
                      <div
                        key={post.id}
                        onClick={() => setActivePost(post)}
                        className="flex items-start gap-4 cursor-pointer group"
                      >
                        <span className="text-2xl font-serif font-black text-marie-gold opacity-80">0{idx + 1}</span>
                        <div>
                          <div style={{ color: darkMode ? '#FFFFFF' : '#121212' }} className="text-xs font-bold leading-snug group-hover:text-marie-gold transition-colors">
                            {post.title}
                          </div>
                          <div className="text-[10px] text-zinc-500 font-bold mt-1">{post.readTime}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

              </div>

            </div>
          </section>

          {/* ESSAY READING MODAL */}
          {activePost && (
            <div className="fixed inset-0 z-[9999] bg-black/80 backdrop-blur-xl flex items-center justify-center p-4 sm:p-8 animate-fadeIn">
              <div
                style={{ backgroundColor: darkMode ? '#0F0E17' : '#FFFFFF', color: darkMode ? '#FFFFFF' : '#121212' }}
                className="max-w-4xl w-full max-h-[90vh] overflow-y-auto rounded-3xl p-8 sm:p-12 border-2 border-marie-gold shadow-2xl relative text-left"
              >
                {/* Close Button */}
                <button
                  onClick={() => setActivePost(null)}
                  className="absolute top-6 right-6 p-2 rounded-full bg-marie-gold/20 text-marie-gold hover:bg-marie-gold hover:text-black transition-all"
                >
                  <i data-lucide="x" className="w-6 h-6"></i>
                </button>

                <div className="space-y-6">
                  <div className="flex items-center gap-3">
                    <span
                      style={{ color: activePost.catColor, backgroundColor: activePost.catBg }}
                      className="px-3 py-1 rounded-full text-xs font-black tracking-widest uppercase"
                    >
                      {activePost.category}
                    </span>
                    <span className="text-xs font-bold text-zinc-500">{activePost.readTime} • {activePost.date}</span>
                  </div>

                  <h1 style={{ color: darkMode ? '#FFFFFF' : '#121212' }} className="font-serif text-3xl sm:text-5xl font-black leading-tight">
                    {activePost.title}
                  </h1>

                  <div className="flex items-center gap-4 py-4 border-y border-zinc-200 dark:border-white/10">
                    <img
                      src="https://images.unsplash.com/photo-1557804506-669a67965ba0?auto=format&fit=crop&w=150&q=80"
                      alt="Yash Agarwal"
                      className="w-12 h-12 rounded-full object-cover border-2 border-marie-gold"
                    />
                    <div>
                      <div style={{ color: darkMode ? '#FFFFFF' : '#121212' }} className="text-sm font-black">Yash Agarwal</div>
                      <div className="text-xs text-marie-gold font-bold">Executive Growth Architect & Author</div>
                    </div>
                  </div>

                  <img
                    src={activePost.image}
                    alt={activePost.title}
                    className="w-full h-80 object-cover rounded-2xl border border-zinc-200 dark:border-white/10"
                  />

                  <div
                    dangerouslySetInnerHTML={{ __html: activePost.content }}
                    className="prose dark:prose-invert max-w-none text-base sm:text-lg leading-relaxed pt-4"
                  />

                  <div className="pt-8 border-t border-zinc-200 dark:border-white/10 flex flex-wrap items-center justify-between gap-4">
                    <button
                      onClick={() => setActivePost(null)}
                      className="px-8 py-3 rounded-full bg-marie-gold text-black text-xs font-black uppercase tracking-widest hover:scale-105 transition-all"
                    >
                      ← Back To All Essays
                    </button>
                    <a
                      href="index.html#audit"
                      className="px-8 py-3 rounded-full bg-[#E2F16D] text-black text-xs font-black uppercase tracking-widest border border-black"
                    >
                      Get Free Audit ✦
                    </a>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* EXPANDED FOOTER */}
          <footer className={`border-t ${darkMode ? 'bg-black border-white/10 text-zinc-400' : 'bg-white border-marie-border text-zinc-500'}`}>
            <div className="max-w-7xl mx-auto px-6 sm:px-12 py-14">
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-8 mb-10 text-left">
                {/* Brand */}
                <div className="col-span-2 sm:col-span-1 space-y-3">
                  <img src="maylogo.png" alt="MAY Logo" className="h-10 w-auto object-contain brightness-150 contrast-125 filter drop-shadow-[0_0_12px_rgba(212,175,55,0.5)]" />
                  <p className="text-xs leading-relaxed">Executive Growth Architect. Author. CMO. Speaker. Built on first principles, not favours.</p>
                  <div className="flex gap-2">
                    {['linkedin', 'instagram', 'youtube', 'twitter'].map(icon => (
                      <a key={icon} href={`https://${icon}.com/meagarwalyash`} target="_blank"
                        className={`w-8 h-8 rounded-lg flex items-center justify-center text-xs transition-all hover:text-marie-gold ${darkMode ? 'bg-white/5 hover:bg-white/10' : 'bg-zinc-100 hover:bg-zinc-200'}`}
                      >
                        <i data-lucide={icon} className="w-3.5 h-3.5"></i>
                      </a>
                    ))}
                  </div>
                </div>

                {/* Sections */}
                <div className="space-y-3">
                  <div className="text-xs font-bold text-marie-gold uppercase tracking-widest">Navigate</div>
                  {[['store.html', '🛍️ Digital Store'], ['resources.html', '🎁 Free Resources'], ['blog.html', '✍️ Growth Essays'], ['speaking.html', '💼 Consulting'], ['dashboard.html', '👤 Customer Dashboard']].map(([href, label]) => (
                    <a key={href} href={href} className="block text-xs hover:text-marie-gold transition-colors font-semibold">{label}</a>
                  ))}
                </div>
                <div className="space-y-3">
                  <div className="text-xs font-bold text-marie-gold uppercase tracking-widest">Work</div>
                  {[['index.html#impact', 'Impact Dashboard'], ['index.html#journey', 'My Journey'], ['media.html', 'Press & Media'], ['index.html#tv', 'Videos & Podcasts'], ['index.html#book', 'No Godfather Book']].map(([href, label]) => (
                    <a key={href} href={href} className="block text-xs hover:text-marie-gold transition-colors">{label}</a>
                  ))}
                </div>
                <div className="space-y-3">
                  <div className="text-xs font-bold text-marie-gold uppercase tracking-widest">Contact</div>
                  <a href="mailto:yash@meagarwalyash.com" className="block text-xs hover:text-marie-gold transition-colors">yash@meagarwalyash.com</a>
                  <a href="https://linkedin.com/in/meagarwalyash" target="_blank" className="block text-xs hover:text-marie-gold transition-colors">LinkedIn</a>
                  <a href="https://instagram.com/meagarwalyash" target="_blank" className="block text-xs hover:text-marie-gold transition-colors">Instagram</a>
                  <a href="https://youtube.com/@meagarwalyash" target="_blank" className="block text-xs hover:text-marie-gold transition-colors">YouTube Channel</a>
                  <div className={`text-xs mt-2 ${darkMode ? 'text-zinc-600' : 'text-zinc-400'}`}>Mumbai, India 🇮🇳</div>
                </div>
              </div>

              {/* Bottom bar */}
              <div className={`pt-6 border-t flex flex-col sm:flex-row items-center justify-between gap-2 text-xs ${darkMode ? 'border-white/10' : 'border-marie-border'}`}>
                <div>© 2026 Yash Agarwal (@MeAgarwalYash). All Rights Reserved.</div>
                <div className="text-marie-gold font-bold">MUMBAI, INDIA • LIVE IST</div>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<BlogApp />);
  </script>
</body>
