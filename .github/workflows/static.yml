name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Static Site Artifacts
        run: |
          mkdir -p dist
          cp -r *.html *.json *.xml *.txt *.png *.jpg *.svg *.pdf CNAME dist/ 2>/dev/null || true
          touch dist/.nojekyll
          touch .nojekyll
          for d in media-kit store admin resources js logos EBOOKS public; do
            if [ -d "$d" ]; then cp -r "$d" dist/; fi
          done

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
