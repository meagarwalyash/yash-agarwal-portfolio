name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Static Site
        run: |
          mkdir -p dist
          cp -r *.html *.json *.xml *.txt *.png *.jpg *.svg *.pdf CNAME dist/ 2>/dev/null || true
          touch dist/.nojekyll
          touch .nojekyll
          for d in media-kit store admin resources js logos EBOOKS public; do
            if [ -d "$d" ]; then cp -r "$d" dist/; fi
          done

      - name: Deploy Static Assets to Cloudflare Workers / Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --assets=dist
