<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DRCV1573GQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-DRCV1573GQ');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student & Executive Dashboard — Yash Agarwal (MeAgarwalYash)</title>
  <meta name="description" content="Manage your purchased courses, masterclasses, digital SOPs, invoices, and certificates on the MAY platform." />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#D4AF37',
              goldHover: '#B5942B',
              dark: '#0A090E',
              darkCard: '#14131B',
              border: 'rgba(212, 175, 55, 0.25)'
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel CDN (High Speed Cloudflare & jsDelivr) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin></script>

  <!-- Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Platform Scripts -->
  <script src="js/auth.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .gold-glow { box-shadow: 0 0 30px rgba(212, 175, 55, 0.25); }
    .glass-dark { background: rgba(20, 19, 27, 0.85); backdrop-filter: blur(16px); }
  </style>
</head>
<body class="bg-[#0A090E] text-white min-h-screen antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function DashboardApp() {
      const [activeTab, setActiveTab] = useState('courses'); // 'courses' | 'orders' | 'downloads' | 'profile'
      const [user, setUser] = useState(null);
      const [cmsData, setCmsData] = useState(null);

      useEffect(() => {
        // Load user session
        let currentUser = window.MAY_AuthEngine ? window.MAY_AuthEngine.getCurrentUser() : null;
        if (!currentUser) {
          // Provision fallback demo user for preview
          currentUser = {
            id: 'usr_demo',
            name: 'Rajesh Mehta',
            email: 'rajesh@company.com',
            phone: '+91 98765 43210',
            gst: '27AAAAA0000A1Z5',
            memberTier: 'Pro Growth Executive',
            purchasedCourses: ['c1'],
            purchasedProducts: ['dp1', 'dp2'],
            orders: [
              { orderId: 'MAY_ORD_849201', itemTitle: 'The Personal Brand & Executive PR Masterclass', amount: 9999, timestamp: '2026-07-20T10:30:00Z', paymentId: 'pay_live_849201' },
              { orderId: 'MAY_ORD_310492', itemTitle: 'The Executive PR & Newsjacking Swipe File', amount: 1499, timestamp: '2026-07-15T14:20:00Z', paymentId: 'pay_live_310492' }
            ]
          };
        }
        setUser(currentUser);

        // Load CMS Data
        const saved = localStorage.getItem('MAY_WEBSITE_CMS_DATA');
        if (saved) {
          try { setCmsData(JSON.parse(saved)); } catch(e) {}
        }

        if (window.lucide) window.lucide.createIcons();
      }, []);

      const handleLogout = () => {
        if (window.MAY_AuthEngine) window.MAY_AuthEngine.logout();
        else window.location.href = 'index.html';
      };

      const coursesList = cmsData?.courses || [
        {
          id: 'c1',
          title: 'The Personal Brand & Executive PR Masterclass',
          category: 'BRAND EQUITY',
          progress: 45,
          thumbnail: 'https://images.unsplash.com/photo-1557804506-669a67965ba0?auto=format&fit=crop&w=800&q=80',
          lessonsCount: 12
        },
        {
          id: 'c2',
          title: 'Performance Marketing Engine: Scaling to ₹3Cr/Month',
          category: 'PERFORMANCE',
          progress: 10,
          thumbnail: 'https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=800&q=80',
          lessonsCount: 18
        }
      ];

      const downloadsList = cmsData?.digitalProducts || [
        {
          id: 'dp1',
          title: 'The Executive PR & Newsjacking Swipe File',
          fileType: 'ZIP (PDF + Prompts)',
          downloadUrl: '#'
        },
        {
          id: 'dp2',
          title: 'Multi-Crore Performance Marketing SOPs & Calculators',
          fileType: 'ZIP (Excel + Canva)',
          downloadUrl: '#'
        }
      ];

      return (
        <div className="min-h-screen flex flex-col justify-between p-4 sm:p-8 relative overflow-hidden">
          {/* Ambient Glow */}
          <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[900px] h-[500px] bg-brand-gold/10 rounded-full blur-[150px] pointer-events-none"></div>

          {/* Header Navigation */}
          <header className="max-w-7xl mx-auto w-full flex items-center justify-between py-4 border-b border-white/10 mb-8 relative z-10">
            <a href="index.html" className="flex items-center gap-3">
              <img src="maylogo.png" alt="MAY Logo" className="h-10 w-auto brightness-150 drop-shadow-md" />
              <span className="text-xs font-bold text-brand-gold uppercase tracking-wider hidden sm:inline">Student & Executive Portal</span>
            </a>
            <div className="flex items-center gap-4">
              <span className="text-xs font-semibold text-zinc-300 hidden md:inline">Welcome, <strong>{user?.name}</strong></span>
              <button
                onClick={handleLogout}
                className="px-4 py-2 rounded-full border border-white/20 text-xs font-bold hover:bg-white/10 transition-colors"
              >
                Sign Out
              </button>
            </div>
          </header>

          {/* Dashboard Container */}
          <main className="max-w-7xl mx-auto w-full space-y-8 relative z-10 flex-1">
            
            {/* Top User Overview Card */}
            <div className="glass-dark rounded-3xl p-6 sm:p-8 border border-brand-gold/30 flex flex-col md:flex-row items-start md:items-center justify-between gap-6 gold-glow">
              <div className="flex items-center gap-5">
                <div className="w-16 h-16 rounded-full bg-brand-gold/20 text-brand-gold flex items-center justify-center font-bold text-2xl border border-brand-gold/40">
                  {user?.name ? user.name.charAt(0) : 'U'}
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-2xl font-bold">{user?.name}</h1>
                    <span className="px-3 py-0.5 rounded-full text-[10px] font-bold text-black bg-brand-gold uppercase">{user?.memberTier || 'Pro Executive'}</span>
                  </div>
                  <p className="text-xs text-zinc-400 mt-1">{user?.email} • Member since 2026</p>
                </div>
              </div>

              <div className="flex flex-wrap gap-3">
                <a
                  href="course-player.html"
                  className="px-6 py-3 rounded-full bg-brand-gold hover:bg-brand-goldHover text-black font-bold text-xs transition-all shadow-md flex items-center gap-2"
                >
                  <span>Continue Learning →</span>
                </a>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="flex border-b border-white/10 gap-6 overflow-x-auto pb-2">
              {[
                { id: 'courses', label: 'My Enrolled Courses' },
                { id: 'orders', label: 'Order History & Invoices' },
                { id: 'downloads', label: 'My Digital Downloads' },
                { id: 'profile', label: 'Profile & Billing Settings' },
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`pb-3 text-sm font-bold transition-all whitespace-nowrap border-b-2 ${activeTab === tab.id ? 'border-brand-gold text-brand-gold' : 'border-transparent text-zinc-400 hover:text-white'}`}
                >
                  {tab.label}
                </button>
              ))}
            </div>

            {/* TAB CONTENT: MY COURSES */}
            {activeTab === 'courses' && (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 animate-fadeIn">
                {coursesList.map(c => (
                  <div key={c.id} className="glass-dark rounded-3xl overflow-hidden border border-white/10 flex flex-col justify-between group hover:border-brand-gold/50 transition-all">
                    <div>
                      <div className="aspect-video relative overflow-hidden">
                        <img src={c.thumbnail} alt={c.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                        <span className="absolute top-3 left-3 px-3 py-1 rounded-full bg-black/80 text-[10px] font-bold text-brand-gold uppercase">{c.category}</span>
                      </div>
                      <div className="p-6 space-y-3">
                        <h3 className="text-lg font-bold leading-snug">{c.title}</h3>
                        
                        {/* Progress Bar */}
                        <div className="space-y-1">
                          <div className="flex justify-between text-xs font-semibold text-zinc-400">
                            <span>Course Progress</span>
                            <span className="text-brand-gold">{c.progress || 45}% Completed</span>
                          </div>
                          <div className="w-full h-2 rounded-full bg-white/10 overflow-hidden">
                            <div className="h-full bg-brand-gold rounded-full" style={{ width: `${c.progress || 45}%` }}></div>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div className="p-6 pt-0">
                      <a
                        href={`course-player.html?id=${c.id}`}
                        className="w-full py-3 rounded-full bg-white/10 hover:bg-brand-gold hover:text-black font-bold text-xs transition-all flex items-center justify-center gap-2 text-white"
                      >
                        <span>Resume Lesson →</span>
                      </a>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* TAB CONTENT: ORDERS & INVOICES */}
            {activeTab === 'orders' && (
              <div className="glass-dark rounded-3xl p-6 border border-white/10 space-y-4 animate-fadeIn">
                <h3 className="text-lg font-bold">Purchase History & Tax Invoices</h3>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs text-zinc-300">
                    <thead className="border-b border-white/10 text-zinc-400 uppercase font-bold">
                      <tr>
                        <th className="py-3 px-4">Order ID</th>
                        <th className="py-3 px-4">Item Description</th>
                        <th className="py-3 px-4">Date</th>
                        <th className="py-3 px-4">Amount</th>
                        <th className="py-3 px-4">Status</th>
                        <th className="py-3 px-4">Action</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-white/5">
                      {(user?.orders || []).map(ord => (
                        <tr key={ord.orderId}>
                          <td className="py-4 px-4 font-mono font-bold text-brand-gold">{ord.orderId}</td>
                          <td className="py-4 px-4 font-semibold text-white">{ord.itemTitle}</td>
                          <td className="py-4 px-4">{new Date(ord.timestamp).toLocaleDateString()}</td>
                          <td className="py-4 px-4 font-bold">₹{ord.amount.toLocaleString()}</td>
                          <td className="py-4 px-4"><span className="px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-400 text-[10px] font-bold">PAID</span></td>
                          <td className="py-4 px-4">
                            <button
                              onClick={() => alert(`Downloading Official Invoice for Order #${ord.orderId}`)}
                              className="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 font-bold transition-all text-[11px]"
                            >
                              Download Invoice
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* TAB CONTENT: DIGITAL DOWNLOADS */}
            {activeTab === 'downloads' && (
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 animate-fadeIn">
                {downloadsList.map(d => (
                  <div key={d.id} className="glass-dark rounded-3xl p-6 border border-white/10 space-y-4 flex items-center justify-between">
                    <div>
                      <span className="text-[10px] font-bold text-brand-gold uppercase">{d.fileType}</span>
                      <h4 className="text-base font-bold">{d.title}</h4>
                      <p className="text-xs text-zinc-400 mt-1">Purchased & Verified</p>
                    </div>
                    <button
                      onClick={() => alert(`Downloading ${d.title}`)}
                      className="px-5 py-3 rounded-full bg-brand-gold text-black font-bold text-xs hover:bg-brand-goldHover transition-all gold-glow"
                    >
                      Download File
                    </button>
                  </div>
                ))}
              </div>
            )}

            {/* TAB CONTENT: PROFILE SETTINGS */}
            {activeTab === 'profile' && (
              <div className="glass-dark rounded-3xl p-6 sm:p-8 border border-white/10 max-w-2xl space-y-6 animate-fadeIn">
                <h3 className="text-lg font-bold">Personal & Billing Profile</h3>
                <div className="space-y-4 text-xs">
                  <div>
                    <label className="block text-zinc-400 font-bold uppercase mb-1">Full Name</label>
                    <input type="text" defaultValue={user?.name} className="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/15 text-white" />
                  </div>
                  <div>
                    <label className="block text-zinc-400 font-bold uppercase mb-1">Email Address</label>
                    <input type="email" readOnly defaultValue={user?.email} className="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/15 text-zinc-400 cursor-not-allowed" />
                  </div>
                  <div>
                    <label className="block text-zinc-400 font-bold uppercase mb-1">Phone Number</label>
                    <input type="tel" defaultValue={user?.phone} className="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/15 text-white" />
                  </div>
                  <div>
                    <label className="block text-zinc-400 font-bold uppercase mb-1">GST Identification Number</label>
                    <input type="text" defaultValue={user?.gst} className="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/15 text-white uppercase" />
                  </div>
                  <button onClick={() => alert('Profile settings updated!')} className="px-6 py-3 rounded-full bg-brand-gold text-black font-bold hover:bg-brand-goldHover transition-all">
                    Save Profile Changes
                  </button>
                </div>
              </div>
            )}

          </main>

          {/* Footer Signature */}
          <footer className="max-w-7xl mx-auto w-full text-center py-6 text-xs text-zinc-500 border-t border-white/10 mt-12 relative z-10">
            © 2026 Yash Agarwal (MeAgarwalYash.com). MAY Growth Operating System v2.0.
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<DashboardApp />);
  </script>
</body>
</html>
