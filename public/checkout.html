<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DRCV1573GQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-DRCV1573GQ');
  </script>

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1230021023248251"
     crossorigin="anonymous"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure One-Page Checkout — Yash Agarwal (MeAgarwalYash)</title>
  <meta name="description" content="Secure luxury checkout for Yash Agarwal courses, SOPs, prompt packs, and 1-on-1 executive advisory." />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#D4AF37',
              goldHover: '#B5942B',
              dark: '#0A090E',
              darkCard: '#14131B',
              border: 'rgba(212, 175, 55, 0.25)'
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel CDN (High Speed Cloudflare & jsDelivr) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin></script>

  <!-- Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Razorpay SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <!-- Platform Scripts -->
  <script src="js/auth.js"></script>
  <script src="js/payments.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .gold-glow { box-shadow: 0 0 30px rgba(212, 175, 55, 0.25); }
    .glass-dark { background: rgba(20, 19, 27, 0.85); backdrop-filter: blur(16px); }
  </style>
</head>
<body class="bg-[#0A090E] text-white min-h-screen antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function CheckoutApp() {
      const [item, setItem] = useState({
        id: 'c1',
        title: 'The Personal Brand & Executive PR Masterclass',
        price: 9999,
        originalPrice: 14999,
        type: 'course',
        category: 'EXECUTIVE MASTERCLASS'
      });

      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [phone, setPhone] = useState('');
      const [gst, setGst] = useState('');
      const [coupon, setCoupon] = useState('');
      const [discount, setDiscount] = useState(0);
      const [couponApplied, setCouponApplied] = useState(false);
      const [couponError, setCouponError] = useState('');
      const [isProcessing, setIsProcessing] = useState(false);
      const [orderSuccess, setOrderSuccess] = useState(null);

      useEffect(() => {
        // Read URL query parameters if item specified e.g. checkout.html?id=c1&type=course
        const params = new URLSearchParams(window.location.search);
        const title = params.get('title');
        const price = params.get('price');
        const type = params.get('type');
        const id = params.get('id');

        if (title && price) {
          setItem({
            id: id || 'item_' + Date.now(),
            title: title,
            price: parseFloat(price),
            originalPrice: Math.round(parseFloat(price) * 1.5),
            type: type || 'product',
            category: 'DIGITAL ASSET'
          });
        }

        // Auto-fill logged in user info
        if (window.MAY_AuthEngine) {
          const user = window.MAY_AuthEngine.getCurrentUser();
          if (user) {
            setName(user.name || '');
            setEmail(user.email || '');
            setPhone(user.phone || '');
            setGst(user.gst || '');
          }
        }

        if (window.lucide) window.lucide.createIcons();
      }, []);

      const handleApplyCoupon = (e) => {
        e.preventDefault();
        setCouponError('');
        const code = coupon.trim().toUpperCase();
        if (code === 'YASH10') {
          setDiscount(Math.round(item.price * 0.10));
          setCouponApplied(true);
        } else if (code === 'GROWTH50') {
          setDiscount(Math.round(item.price * 0.50));
          setCouponApplied(true);
        } else if (code === 'NO_GODFATHER') {
          setDiscount(1000);
          setCouponApplied(true);
        } else {
          setCouponError('Invalid coupon code. Try YASH10 or GROWTH50');
        }
      };

      const finalPrice = Math.max(0, item.price - discount);
      const gstAmount = Math.round(finalPrice * 0.18);
      const grandTotal = finalPrice + gstAmount;

      const handlePayNow = async (e) => {
        e.preventDefault();
        if (!email.trim() || !name.trim()) {
          alert('Please provide your name and email address.');
          return;
        }

        setIsProcessing(true);

        const checkoutItem = {
          id: item.id,
          title: item.title,
          price: grandTotal,
          type: item.type
        };

        const userDetails = { name, email, phone, gst };

        window.MAY_PaymentEngine.processCheckout(
          checkoutItem,
          userDetails,
          (orderResult) => {
            setIsProcessing(false);
            setOrderSuccess(orderResult);
          },
          (error) => {
            setIsProcessing(false);
            if (error && error.message && error.message !== 'Payment cancelled by user') {
              console.error('Payment error:', error);
            }
          }
        );
      };

      return (
        <div className="min-h-screen flex flex-col justify-between p-4 sm:p-8 relative overflow-hidden">
          {/* Background Glow */}
          <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[400px] bg-brand-gold/10 rounded-full blur-[140px] pointer-events-none"></div>

          {/* Top Header */}
          <header className="max-w-6xl mx-auto w-full flex items-center justify-between py-4 border-b border-white/10 mb-8 relative z-10">
            <a href="index.html" className="flex items-center gap-3">
              <img src="maylogo.png" alt="MAY Logo" className="h-9 w-auto brightness-150 drop-shadow-md" />
              <span className="text-xs font-bold text-brand-gold uppercase tracking-wider hidden sm:inline">Official Store Checkout</span>
            </a>
            <div className="flex items-center gap-4 text-xs font-semibold text-zinc-400">
              <span className="flex items-center gap-1 text-emerald-400"><i data-lucide="shield-check" className="w-4 h-4"></i> 256-Bit SSL Encrypted</span>
              <a href="index.html" className="hover:text-white transition-colors">← Back to Site</a>
            </div>
          </header>

          {/* Main Checkout View */}
          <main className="max-w-6xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-8 relative z-10 my-auto">
            
            {orderSuccess ? (
              /* Order Confirmation Success State */
              <div className="lg:col-span-12 glass-dark rounded-3xl p-8 sm:p-12 border border-brand-gold/40 text-center space-y-6 animate-fadeIn gold-glow">
                <div className="w-20 h-20 rounded-full bg-brand-gold/20 text-brand-gold flex items-center justify-center mx-auto text-4xl font-bold">
                  ✓
                </div>
                <div className="space-y-2">
                  <span className="text-xs font-bold text-brand-gold uppercase tracking-widest">PAYMENT CONFIRMED • ORDER #{orderSuccess.orderId}</span>
                  <h1 className="text-3xl sm:text-5xl font-bold">Welcome to the Platform!</h1>
                  <p className="text-zinc-300 max-w-xl mx-auto text-sm leading-relaxed">
                    Thank you, <strong>{orderSuccess.userName}</strong>. Your payment of <strong>₹{orderSuccess.amount.toLocaleString()}</strong> for <em>"{orderSuccess.itemTitle}"</em> was successful.
                  </p>
                </div>

                <div className="flex flex-wrap justify-center gap-4 pt-4">
                  <a
                    href="dashboard.html"
                    className="px-8 py-4 rounded-full bg-brand-gold text-black font-bold text-sm hover:bg-brand-goldHover transition-all gold-glow"
                  >
                    Go to My Student Dashboard →
                  </a>
                  <a
                    href={item.type === 'course' ? 'course-player.html' : 'dashboard.html'}
                    className="px-8 py-4 rounded-full border border-white/20 text-white font-bold text-sm hover:bg-white/10 transition-all"
                  >
                    {item.type === 'course' ? 'Start Watching Course Now →' : 'Download Assets →'}
                  </a>
                </div>
              </div>
            ) : (
              /* Order Checkout Form & Summary */
              <React.Fragment>
                {/* Left Column: Purchaser Details & Payment Options */}
                <div className="lg:col-span-7 glass-dark rounded-3xl p-6 sm:p-8 border border-white/10 space-y-6">
                  <div className="border-b border-white/10 pb-4">
                    <h2 className="text-2xl font-bold">Billing & Contact Information</h2>
                    <p className="text-xs text-zinc-400 mt-1">Your access credentials will be delivered to this email address.</p>
                  </div>

                  <form onSubmit={handlePayNow} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-zinc-300 uppercase tracking-wider mb-2">Full Name *</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. Rajesh Mehta"
                        value={name}
                        onChange={e => setName(e.target.value)}
                        className="w-full px-4 py-3.5 rounded-xl bg-white/5 border border-white/15 text-white text-sm focus:outline-none focus:border-brand-gold"
                      />
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold text-zinc-300 uppercase tracking-wider mb-2">Work Email Address *</label>
                        <input
                          type="email"
                          required
                          placeholder="rajesh@company.com"
                          value={email}
                          onChange={e => setEmail(e.target.value)}
                          className="w-full px-4 py-3.5 rounded-xl bg-white/5 border border-white/15 text-white text-sm focus:outline-none focus:border-brand-gold"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-zinc-300 uppercase tracking-wider mb-2">Phone Number (Optional)</label>
                        <input
                          type="tel"
                          placeholder="+91 98765 43210"
                          value={phone}
                          onChange={e => setPhone(e.target.value)}
                          className="w-full px-4 py-3.5 rounded-xl bg-white/5 border border-white/15 text-white text-sm focus:outline-none focus:border-brand-gold"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-zinc-300 uppercase tracking-wider mb-2">GST Number (Optional for Invoice)</label>
                      <input
                        type="text"
                        placeholder="27AAAAA0000A1Z5"
                        value={gst}
                        onChange={e => setGst(e.target.value)}
                        className="w-full px-4 py-3.5 rounded-xl bg-white/5 border border-white/15 text-white text-sm focus:outline-none focus:border-brand-gold uppercase"
                      />
                    </div>

                    {/* Supported Payment Methods Badge */}
                    <div className="pt-2">
                      <label className="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-3">Supported Payment Methods (via Razorpay)</label>
                      <div className="grid grid-cols-4 gap-2 text-center text-[10px] font-bold text-zinc-300">
                        <div className="p-3 rounded-xl bg-white/5 border border-white/10">UPI (Google Pay / PhonePe)</div>
                        <div className="p-3 rounded-xl bg-white/5 border border-white/10">Credit / Debit Cards</div>
                        <div className="p-3 rounded-xl bg-white/5 border border-white/10">NetBanking</div>
                        <div className="p-3 rounded-xl bg-white/5 border border-white/10">Wallets & EMI</div>
                      </div>
                    </div>

                    <button
                      type="submit"
                      disabled={isProcessing}
                      className="w-full py-4 rounded-full bg-brand-gold hover:bg-brand-goldHover text-black font-bold text-base shadow-xl transition-all gold-glow flex items-center justify-center gap-2 mt-6"
                    >
                      {isProcessing ? 'Processing Secure Gateway...' : `Complete Purchase • ₹${grandTotal.toLocaleString()} →`}
                    </button>
                  </form>
                </div>

                {/* Right Column: Order Summary & Coupon Code */}
                <div className="lg:col-span-5 space-y-6">
                  <div className="glass-dark rounded-3xl p-6 sm:p-8 border border-brand-gold/30 space-y-6">
                    <span className="text-[10px] font-bold text-brand-gold uppercase tracking-widest">{item.category}</span>
                    <h3 className="text-xl font-bold leading-snug">{item.title}</h3>

                    <div className="space-y-3 pt-4 border-t border-white/10 text-sm">
                      <div className="flex justify-between text-zinc-400">
                        <span>Original Price</span>
                        <span className="line-through">₹{item.originalPrice.toLocaleString()}</span>
                      </div>
                      <div className="flex justify-between font-semibold">
                        <span>Special Platform Price</span>
                        <span>₹{item.price.toLocaleString()}</span>
                      </div>
                      {couponApplied && (
                        <div className="flex justify-between font-semibold text-emerald-400">
                          <span>Coupon Discount</span>
                          <span>-₹{discount.toLocaleString()}</span>
                        </div>
                      )}
                      <div className="flex justify-between text-zinc-400 text-xs">
                        <span>Estimated GST (18%)</span>
                        <span>+₹{gstAmount.toLocaleString()}</span>
                      </div>
                      <div className="flex justify-between text-lg font-bold text-brand-gold pt-3 border-t border-white/10">
                        <span>Total Due</span>
                        <span>₹{grandTotal.toLocaleString()}</span>
                      </div>
                    </div>

                    {/* Coupon Apply Form */}
                    <form onSubmit={handleApplyCoupon} className="pt-2">
                      <div className="flex gap-2">
                        <input
                          type="text"
                          placeholder="Coupon Code (e.g. YASH10)"
                          value={coupon}
                          onChange={e => setCoupon(e.target.value)}
                          className="flex-1 px-4 py-2.5 rounded-xl bg-white/5 border border-white/15 text-xs text-white uppercase focus:outline-none focus:border-brand-gold"
                        />
                        <button type="submit" className="px-5 py-2.5 rounded-xl bg-white/15 hover:bg-white/25 text-xs font-bold transition-all">
                          Apply
                        </button>
                      </div>
                      {couponApplied && <p className="text-xs text-emerald-400 font-semibold mt-1">✓ Coupon code applied successfully!</p>}
                      {couponError && <p className="text-xs text-red-400 mt-1">{couponError}</p>}
                    </form>

                    {/* Trust Highlights */}
                    <div className="pt-4 border-t border-white/10 space-y-2 text-xs text-zinc-400">
                      <div className="flex items-center gap-2">✓ Lifetime Instant Access</div>
                      <div className="flex items-center gap-2">✓ Official Tax Invoice Generated</div>
                      <div className="flex items-center gap-2">✓ 100% Satisfaction Guarantee</div>
                    </div>
                  </div>
                </div>
              </React.Fragment>
            )}

          </main>

          {/* EXPANDED FOOTER */}
          <footer className="border-t border-white/10 bg-black text-zinc-400 mt-12 relative z-10">
            <div className="max-w-7xl mx-auto px-6 sm:px-12 py-14">
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-8 mb-10 text-left">
                {/* Brand */}
                <div className="col-span-2 sm:col-span-1 space-y-3">
                  <img src="maylogo.png" alt="MAY Logo" className="h-10 w-auto object-contain brightness-150 contrast-125 filter drop-shadow-[0_0_12px_rgba(212,175,55,0.5)]" />
                  <p className="text-xs leading-relaxed">Executive Growth Architect. Author. CMO. Speaker. Built on first principles, not favours.</p>
                  <div className="flex gap-2">
                    {['linkedin', 'instagram', 'youtube', 'twitter'].map(icon => (
                      <a key={icon} href={`https://${icon}.com/meagarwalyash`} target="_blank"
                        className="w-8 h-8 rounded-lg flex items-center justify-center text-xs transition-all hover:text-brand-gold bg-white/5 hover:bg-white/10"
                      >
                        <i data-lucide={icon} className="w-3.5 h-3.5"></i>
                      </a>
                    ))}
                  </div>
                </div>

                {/* Sections */}
                <div className="space-y-3">
                  <div className="text-xs font-bold text-brand-gold uppercase tracking-widest">Navigate</div>
                  {[['store.html', '🛍️ Digital Store'], ['resources.html', '🎁 Free Resources'], ['blog.html', '✍️ Growth Essays'], ['speaking.html', '💼 Consulting'], ['dashboard.html', '👤 Customer Dashboard']].map(([href, label]) => (
                    <a key={href} href={href} className="block text-xs hover:text-brand-gold transition-colors font-semibold">{label}</a>
                  ))}
                </div>
                <div className="space-y-3">
                  <div className="text-xs font-bold text-brand-gold uppercase tracking-widest">Work</div>
                  {[['index.html#impact', 'Impact Dashboard'], ['index.html#journey', 'My Journey'], ['media.html', 'Press & Media'], ['index.html#tv', 'Videos & Podcasts'], ['index.html#book', 'No Godfather Book']].map(([href, label]) => (
                    <a key={href} href={href} className="block text-xs hover:text-brand-gold transition-colors">{label}</a>
                  ))}
                </div>
                <div className="space-y-3">
                  <div className="text-xs font-bold text-brand-gold uppercase tracking-widest">Contact</div>
                  <a href="mailto:yash@meagarwalyash.com" className="block text-xs hover:text-brand-gold transition-colors">yash@meagarwalyash.com</a>
                  <a href="https://linkedin.com/in/meagarwalyash" target="_blank" className="block text-xs hover:text-brand-gold transition-colors">LinkedIn</a>
                  <a href="https://instagram.com/meagarwalyash" target="_blank" className="block text-xs hover:text-brand-gold transition-colors">Instagram</a>
                  <a href="https://youtube.com/@meagarwalyash" target="_blank" className="block text-xs hover:text-brand-gold transition-colors">YouTube Channel</a>
                  <div className="text-xs mt-2 text-zinc-500">Mumbai, India 🇮🇳</div>
                </div>
              </div>

              {/* Bottom bar */}
              <div className="pt-6 border-t border-white/10 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs">
                <div>© 2026 Yash Agarwal (@MeAgarwalYash). All Rights Reserved.</div>
                <div className="text-brand-gold font-bold">MUMBAI, INDIA • LIVE IST</div>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CheckoutApp />);
  </script>
</body>
</html>
