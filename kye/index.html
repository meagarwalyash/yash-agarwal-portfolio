  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function KyeApp() {
      const [cmsData, setCmsData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [amazonDrawerOpen, setAmazonDrawerOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState("");
      const [searchCategory, setSearchCategory] = useState("All");

      // Modals State
      const [selectedFlyerModal, setSelectedFlyerModal] = useState(null); // flyer image src
      const [bookingModalOpen, setBookingModalOpen] = useState(false);
      const [selectedEventId, setSelectedEventId] = useState("kye-aug21"); // 'kye-aug21' | 'kye-aug22' | 'kye-both'
      const [ticketQty, setTicketQty] = useState(1);
      
      // User Form State
      const [userName, setUserName] = useState("");
      const [userPhone, setUserPhone] = useState("");
      const [userEmail, setUserEmail] = useState("");
      const [userNotes, setUserNotes] = useState("");
      const [submitting, setSubmitting] = useState(false);
      const [successMsg, setSuccessMsg] = useState("");

      useEffect(() => {
        const savedData = localStorage.getItem('MAY_WEBSITE_CMS_DATA');
        if (savedData) {
          try {
            setCmsData(JSON.parse(savedData));
            setLoading(false);
          } catch(e) {
            loadFallbackCms();
          }
        } else {
          loadFallbackCms();
        }

        try {
          const storedUser = JSON.parse(localStorage.getItem('may_lead_user') || '{}');
          if (storedUser.name) setUserName(storedUser.name);
          if (storedUser.phone) setUserPhone(storedUser.phone);
          if (storedUser.email) setUserEmail(storedUser.email);
        } catch(e) {}

        if (window.lucide) {
          setTimeout(() => window.lucide.createIcons(), 200);
        }
      }, []);

      const loadFallbackCms = () => {
        fetch('/cmsData.json')
          .then(res => res.json())
          .then(data => {
            setCmsData(data);
            setLoading(false);
            if (window.lucide) setTimeout(() => window.lucide.createIcons(), 200);
          })
          .catch(() => {
            setLoading(false);
          });
      };

      useEffect(() => {
        if (window.lucide && !loading) {
          window.lucide.createIcons();
        }
      }, [loading, selectedFlyerModal, bookingModalOpen]);

      // Calculate Total Amount
      const getUnitPrice = () => {
        if (selectedEventId === 'kye-both') return 400;
        return 200;
      };

      const totalAmount = getUnitPrice() * ticketQty;

      const handleBookingSubmit = async (e) => {
        e.preventDefault();
        if (!userName || !userPhone || !userEmail) return;
        setSubmitting(true);

        const eventName = selectedEventId === 'kye-both' 
          ? 'KYE Both Days VIP Access Pass (Aug 21-22)' 
          : (selectedEventId === 'kye-aug22' ? 'KYE Saturday Vibes Meet (Aug 22)' : 'KYE Friday Kickstart Meet (Aug 21)');

        const leadPayload = {
          id: 'kye_' + Date.now(),
          customerName: userName.trim(),
          name: userName.trim(),
          phone: userPhone.trim(),
          customerEmail: userEmail.trim().toLowerCase(),
          email: userEmail.trim().toLowerCase(),
          quantity: ticketQty,
          selectedEvent: selectedEventId,
          totalAmount: totalAmount,
          notes: userNotes,
          productId: 'kye_pass',
          productName: `KYE Global Pass (${ticketQty}x - ₹${totalAmount})`,
          source: 'KYE Meets Landing Page',
          createdAt: new Date().toISOString(),
          date: new Date().toISOString().split('T')[0],
          status: 'Confirmed Pass Registration'
        };

        // 1. Store locally in CRM
        try {
          localStorage.setItem('may_lead_user', JSON.stringify(leadPayload));
          const existingLeads = JSON.parse(localStorage.getItem('may_leads') || '[]');
          existingLeads.unshift(leadPayload);
          localStorage.setItem('may_leads', JSON.stringify(existingLeads));

          let savedData = localStorage.getItem('MAY_WEBSITE_CMS_DATA');
          let cms = savedData ? JSON.parse(savedData) : {};
          if (!cms.waitlistData) cms.waitlistData = [];
          if (!cms.subscribers) cms.subscribers = [];
          cms.waitlistData.unshift(leadPayload);
          cms.subscribers.unshift(leadPayload);
          localStorage.setItem('MAY_WEBSITE_CMS_DATA', JSON.stringify(cms));
        } catch(err) {}

        // 2. Post to backend server API
        try {
          await fetch('/api/leads/capture', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(leadPayload)
          });
        } catch(err) {}

        setSubmitting(false);

        // Trigger Payment via Razorpay Checkout SDK if configured or redirect
        if (window.Razorpay) {
          try {
            const options = {
              key: "rzp_test_dummy",
              amount: totalAmount * 100,
              currency: "INR",
              name: "KYE Global",
              description: eventName,
              image: "/maylogo.png",
              prefill: {
                name: userName,
                email: userEmail,
                contact: userPhone
              },
              theme: { color: "#FF5722" },
              handler: function(response) {
                setSuccessMsg(`✓ Payment Received! Pass Confirmed. Payment ID: ${response.razorpay_payment_id || 'RZP_OK'}`);
                setTimeout(() => { setBookingModalOpen(false); setSuccessMsg(''); }, 2000);
              }
            };
            const rzp = new window.Razorpay(options);
            rzp.open();
          } catch(e) {
            triggerWhatsAppFallback(leadPayload);
          }
        } else {
          triggerWhatsAppFallback(leadPayload);
        }
      };

      const triggerWhatsAppFallback = (leadPayload) => {
        setSuccessMsg('✓ Registration Recorded! Opening WhatsApp for Instant Pass Confirmation...');
        const msg = `Hi KYE Global! I have registered for KYE Community Meet.\n\nName: ${leadPayload.name}\nPhone: ${leadPayload.phone}\nPasses: ${ticketQty}x (${leadPayload.productName})\nAmount: ₹${totalAmount}`;
        const waUrl = `https://wa.me/919876543210?text=${encodeURIComponent(msg)}`;

        setTimeout(() => {
          window.open(waUrl, '_blank');
          setBookingModalOpen(false);
          setSuccessMsg('');
        }, 1200);
      };

      const kyeData = cmsData?.kyeEvents || {};
      const eventsList = kyeData.events || [
        {
          id: "kye-aug21",
          title: "Friday Kickstart The Weekend",
          dateLabel: "Friday 21st August",
          time: "8:00 PM – 11:00 PM",
          venue: "Borivali West, Mumbai",

          description: "Kickstart your weekend with Mumbai's most vibrant community of founders, creators, and professionals. Experience an energetic evening of networking, BYOB drinks, fun games, karaoke sessions, and stand-up comedy.",
          activities: [
            { title: "BYOB", desc: "Bring Your Own Bottle" },
            { title: "GAMES", desc: "Fun. People. Good Vibes." },

            { title: "STAND UP", desc: "Laughs That Connect." }
          ]
        },

          activities: [
            { title: "NETWORKING", desc: "Curated Founder Speed Meet" },
            { title: "STAND UP", desc: "Live Comedy Acts" },
            { title: "GAMES", desc: "Group Party Games" },
            { title: "KARAOKE", desc: "Open Mic Stage" },
            { title: "BYOB", desc: "Bring Your Own Bottle" }
          ]
        }
      ];

      return (
        <div className="min-h-screen bg-[#0A090E] text-white flex flex-col justify-between font-sans">

          {/* TOP ANNOUNCEMENT TICKER */}
          <div className="bg-[#120B08] border-b border-brand-orange/40 text-brand-orange py-2 overflow-hidden whitespace-nowrap relative flex items-center shadow-md">
            <div className="inline-flex items-center gap-16 animate-marquee font-bold text-xs tracking-wider">
              <span className="flex items-center gap-2">
                <span>🔥 UPCOMING KYE GLOBAL MEETS IN BORIVALI WEST, MUMBAI • ENTRY ₹200/- ONLY</span>
                <button onClick={() => setBookingModalOpen(true)} className="underline hover:text-white font-extrabold text-white ml-2">Book Pass Now →</button>
              </span>
              <span className="flex items-center gap-2">
                <span>🍾 BYOB • GAMES • KARAOKE • STAND UP COMEDY • FOUNDER NETWORKING</span>
                <button onClick={() => setBookingModalOpen(true)} className="underline hover:text-white font-extrabold text-white ml-2">Reserve Spot →</button>
              </span>
              <span className="flex items-center gap-2">
                <span>📰 FEATURED IN FORBES, MID-DAY &amp; HINDUSTAN TIMES</span>
                <a href="#press" className="underline hover:text-white font-extrabold text-white ml-2">View Press →</a>
              </span>
            </div>
          </div>

          {/* AMAZON.IN STYLE 2-TIER EXECUTIVE HEADER SYSTEM */}
          <header className="sticky top-0 z-50 w-full shadow-2xl font-sans">
            <div className="bg-[#131921] border-b border-[#232F3E] text-white py-2 px-3 sm:px-6">
              <div className="max-w-[1500px] mx-auto flex items-center justify-between gap-2 sm:gap-4">
                
                {/* Brand Logo */}
                <a href="index.html" aria-label="Yash Agarwal Homepage" className="flex items-center group relative z-10 flex-shrink-0">
                  <img
                    src="/maylogo.png"
                    alt="MAY Executive Logo"
                    width="224"
                    height="80"
                    decoding="async"
                    fetchpriority="high"
                    className="h-36 sm:h-48 md:h-56 w-auto object-contain -my-12 sm:-my-18 translate-y-3 transition-transform duration-300 group-hover:scale-105 brightness-150 contrast-125 filter drop-shadow-[0_0_24px_rgba(212,175,55,0.9)]"
                  />
                </a>

                {/* Center Search Bar */}
                <div className="relative flex-1 max-w-3xl mx-1 sm:mx-3">
                  <div className="flex items-center rounded-xl overflow-hidden border border-brand-orange/40 focus-within:ring-2 focus-within:ring-brand-orange shadow-lg bg-[#0F0E17]">
                    <select
                      value={searchCategory}

                    <span>🎟️ Book Pass (₹200)</span>

            {/* Sub-Header Navigation Bar */}
