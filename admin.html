      book: {
        title: "No Godfather",
        subtitle: "FORTHCOMING DEBUT MASTERWORK",

        description: "A definitive guide to building an empire and a personal brand from scratch — written from 12 years of first-hand experience across agency life, corporate marketing leadership, and scaling P&Ls without corporate patronage.",

    function AdminApp() {
      const [authenticated, setAuthenticated] = useState(() => {
        return sessionStorage.getItem('MAY_ADMIN_AUTH') === 'true';
      });
      const [passcode, setPasscode] = useState('');
      const [loginError, setLoginError] = useState(false);
      const [showPassword, setShowPassword] = useState(false);

      const [cmsData, setCmsData] = useState(() => {
        const saved = localStorage.getItem('MAY_WEBSITE_CMS_DATA');
        if (saved) {
          try { return JSON.parse(saved); } catch(e) { return defaultCmsData; }
        }
        return defaultCmsData;
      });

      const [activeTab, setActiveTab] = useState('blogs'); // 'blogs' | 'hero' | 'seo' | 'news' | 'book'
      const [editingBlog, setEditingBlog] = useState(null);
      const [saveStatus, setSaveStatus] = useState('All Changes Saved');
      const [showImageModal, setShowImageModal] = useState(false);
      const [inlineImgUrl, setInlineImgUrl] = useState('');
      const [inlineImgCaption, setInlineImgCaption] = useState('');
      const [inlineImgAlt, setInlineImgAlt] = useState('');

      // Auto-save to LocalStorage whenever cmsData updates
      useEffect(() => {
        if (authenticated) {
          localStorage.setItem('MAY_WEBSITE_CMS_DATA', JSON.stringify(cmsData));
          setSaveStatus('All Changes Saved to LocalStorage ✓');
        }
        if (window.lucide) window.lucide.createIcons();
      }, [cmsData, authenticated]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (passcode.trim() === 'Yash@8565') {
          sessionStorage.setItem('MAY_ADMIN_AUTH', 'true');
          setAuthenticated(true);
          setLoginError(false);
        } else {
          setLoginError(true);
        }
      };

      const handleLogout = () => {
        sessionStorage.removeItem('MAY_ADMIN_AUTH');
        setAuthenticated(false);
        setPasscode('');
      };

      const handleSaveClick = () => {
        localStorage.setItem('MAY_WEBSITE_CMS_DATA', JSON.stringify(cmsData));
        setSaveStatus('✓ Saved Successfully!');
        setTimeout(() => setSaveStatus('All Changes Saved to LocalStorage ✓'), 3000);
      };

      const handleResetDefaults = () => {
        if (confirm("Are you sure you want to reset all CMS content to default settings?")) {
          setCmsData(defaultCmsData);
          localStorage.removeItem('MAY_WEBSITE_CMS_DATA');
        }
      };

      const handleExportJson = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cmsData, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `MAY_CMS_BACKUP_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      // Blog CRUD logic
      const handleCreateNewBlog = () => {
        const newPost = {
          id: `blog-${Date.now()}`,
          heading: "New Enterprise Growth Essay",
          slug: `new-essay-${Date.now()}`,
          category: "PERFORMANCE",
          date: new Date().toLocaleDateString('en-US', { month: 'short', year: 'numeric' }),
          readTime: "5 min read",
          status: "draft",
          coverImg: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=800&q=80",
          coverImgAlt: "Article Cover Image",
          snippet: "Write a short high-converting teaser excerpt for this article...",
          content: "Write your full blog content here...",
          focusKeyword: "Growth Marketing",
          metaTitle: "New Enterprise Growth Essay | Yash Agarwal",
          metaDesc: "Write meta description for search engine compatibility..."
        };
        setCmsData(prev => ({ ...prev, blogs: [newPost, ...prev.blogs] }));
        setEditingBlog(newPost);
      };

      const handleUpdateBlogField = (field, value) => {
        if (!editingBlog) return;
        const updated = { ...editingBlog, [field]: value };
        setEditingBlog(updated);
        setCmsData(prev => ({
          ...prev,
          blogs: prev.blogs.map(b => b.id === updated.id ? updated : b)
        }));
      };

      const handleDeleteBlog = (blogId) => {
        if (confirm("Delete this blog article permanently?")) {
          setCmsData(prev => ({ ...prev, blogs: prev.blogs.filter(b => b.id !== blogId) }));
          if (editingBlog && editingBlog.id === blogId) setEditingBlog(null);
        }
      };

      // Image File Upload Reader (Converts local image to base64 Data URL)
      const handleFileUpload = (file, callback) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          callback(e.target.result);
        };
        reader.readAsDataURL(file);
      };

      // Insert Picture Inside Blog Body
      const handleInsertInsidePicture = () => {
        if (!inlineImgUrl.trim()) return;
        const pictureMarkdown = `\n\n![${inlineImgAlt || 'Article Picture'}](${inlineImgUrl})\n*Figure: ${inlineImgCaption || 'Inside article photo'}*\n\n`;
        handleUpdateBlogField('content', (editingBlog.content || '') + pictureMarkdown);
        setInlineImgUrl('');
        setInlineImgCaption('');
        setInlineImgAlt('');
        setShowImageModal(false);
      };

      // RENDER PASSWORD LOGIN SCREEN IF NOT AUTHENTICATED
      if (!authenticated) {
        return (
          <div className="min-h-screen bg-[#0A090E] text-white flex flex-col items-center justify-center p-4 relative font-sans">
            <div className="fixed top-0 left-1/2 -translate-x-1/2 w-[700px] h-[400px] bg-gradient-to-b from-brand-gold/15 via-brand-gold/5 to-transparent blur-[140px] pointer-events-none z-0"></div>
            
            <div className="relative z-10 w-full max-w-md bg-[#14131B] border border-brand-gold/40 rounded-3xl p-8 shadow-2xl space-y-6 text-center">
              <div className="w-14 h-14 rounded-full bg-brand-gold/20 border border-brand-gold/40 text-brand-gold flex items-center justify-center mx-auto shadow-inner">
                <i data-lucide="lock" className="w-7 h-7"></i>
              </div>

              <div className="space-y-1">
                <h1 className="text-2xl font-bold text-white tracking-tight">MAY CMS Executive Gate</h1>
                <p className="text-xs text-zinc-400 font-mono">Enter Master Passcode to Access Admin Panel</p>
              </div>

              {loginError && (
                <div className="p-3.5 rounded-xl bg-rose-950/60 border border-rose-800 text-rose-300 text-xs font-bold font-mono">
                  ✕ Incorrect Passcode. Please try again.
                </div>
              )}

              <form onSubmit={handleLogin} className="space-y-4 text-left">
                <div className="space-y-2">
                  <label className="text-xs font-bold text-zinc-300 font-mono">Admin Master Passcode:</label>
                  <div className="relative">
                    <input
                      type={showPassword ? "text" : "password"}
                      required
                      placeholder="Enter Passcode..."
                      value={passcode}
                      onChange={(e) => setPasscode(e.target.value)}
                      className="w-full p-3.5 pr-10 rounded-xl bg-black border border-[#232230] text-white text-sm font-mono focus:border-brand-gold focus:outline-none"
                    />
                    <button
                      type="button"
                      onClick={() => setShowPassword(!showPassword)}
                      className="absolute right-3 top-3.5 text-zinc-400 hover:text-white text-xs"
                    >
                      {showPassword ? "Hide" : "Show"}
                    </button>
                  </div>
                </div>

                <button
                  type="submit"
                  className="w-full py-3.5 rounded-full bg-gradient-to-r from-brand-gold via-brand-goldLight to-brand-gold text-black font-bold text-xs shadow-lg shadow-brand-gold/20 hover:scale-[1.02] transition-transform"
                >
                  Unlock Admin Panel 🔒
                </button>
              </form>

              <div className="pt-4 border-t border-white/10 flex justify-between items-center text-[11px] text-zinc-500 font-mono">
                <a href="cindex.html" className="hover:text-brand-gold text-zinc-400 underline">← Return to Website</a>
                <span>Security Level: High</span>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-[#0A090E] text-white flex flex-col font-sans">
          
          {/* HEADER BAR */}
          <header className="bg-[#111018] border-b border-[#232230] px-6 py-4 flex items-center justify-between sticky top-0 z-40">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-full bg-brand-gold text-black font-bold flex items-center justify-center text-xs">
                MAY
              </div>
              <div>
                <h1 className="text-base font-bold tracking-wide">MAY CMS Executive Admin Console</h1>
                <div className="text-xs text-brand-gold font-mono">{saveStatus}</div>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <button
                onClick={handleSaveClick}
                className="px-5 py-2 rounded-full bg-brand-gold hover:bg-brand-goldHover text-black font-bold text-xs shadow-lg transition-all"
              >
                Save All Edits
              </button>

              <a
                href="cindex.html"
                target="_blank"
                className="px-4 py-2 rounded-full bg-white/10 hover:bg-white/20 text-white font-bold text-xs transition-all flex items-center gap-1.5"
              >
                <span>View Live Site</span>
                <i data-lucide="external-link" className="w-3.5 h-3.5"></i>
              </a>

              <button
                onClick={handleExportJson}
                className="p-2 rounded-full bg-white/5 text-zinc-300 hover:text-white"
                title="Export JSON Backup"
              >
                <i data-lucide="download" className="w-4 h-4"></i>
              </button>

              <button
                onClick={handleResetDefaults}
                className="p-2 rounded-full bg-rose-950/40 text-rose-400 hover:bg-rose-900/60"
                title="Reset to Defaults"
              >
                <i data-lucide="rotate-ccw" className="w-4 h-4"></i>
              </button>

              <button
                onClick={handleLogout}
                className="px-3.5 py-2 rounded-full bg-rose-950/60 border border-rose-800 text-rose-300 font-bold text-xs hover:bg-rose-900/80 transition-all flex items-center gap-1.5"
                title="Lock Session & Logout"
              >
                <span>Lock 🔒</span>
              </button>
            </div>
          </header>

          {/* MAIN TWO-COLUMN LAYOUT */}
          <div className="flex-1 flex overflow-hidden">
            
            {/* SIDEBAR NAVIGATION TABS */}
            <aside className="w-64 bg-[#111018] border-r border-[#232230] p-4 flex flex-col justify-between shrink-0">
              <div className="space-y-1">
                <div className="px-3 py-2 text-[10px] font-bold text-zinc-500 uppercase tracking-widest font-mono">CONTENT MANAGEMENT</div>
                
                <button
                  onClick={() => setActiveTab('blogs')}
                  className={`w-full text-left px-3.5 py-3 rounded-xl text-xs font-bold flex items-center gap-3 transition-all ${activeTab === 'blogs' ? 'bg-brand-gold text-black shadow-md' : 'text-zinc-300 hover:bg-white/5'}`}
                >
                  <i data-lucide="book-open" className="w-4 h-4"></i>
                  <span>Blogs & Publisher</span>
                </button>

                <button
                  onClick={() => setActiveTab('hero')}
                  className={`w-full text-left px-3.5 py-3 rounded-xl text-xs font-bold flex items-center gap-3 transition-all ${activeTab === 'hero' ? 'bg-brand-gold text-black shadow-md' : 'text-zinc-300 hover:bg-white/5'}`}
                >
                  <i data-lucide="user" className="w-4 h-4"></i>
                  <span>Hero & Executive Bio</span>
                </button>

                <button
                  onClick={() => setActiveTab('seo')}
                  className={`w-full text-left px-3.5 py-3 rounded-xl text-xs font-bold flex items-center gap-3 transition-all ${activeTab === 'seo' ? 'bg-brand-gold text-black shadow-md' : 'text-zinc-300 hover:bg-white/5'}`}
                >
                  <i data-lucide="search" className="w-4 h-4"></i>
                  <span>SEO & Meta Engine</span>
                </button>

                <button
                  onClick={() => setActiveTab('news')}
                  className={`w-full text-left px-3.5 py-3 rounded-xl text-xs font-bold flex items-center gap-3 transition-all ${activeTab === 'news' ? 'bg-brand-gold text-black shadow-md' : 'text-zinc-300 hover:bg-white/5'}`}
                >
                  <i data-lucide="newspaper" className="w-4 h-4"></i>
                  <span>News & Media Press</span>
                </button>

                <button
                  onClick={() => setActiveTab('book')}
                  className={`w-full text-left px-3.5 py-3 rounded-xl text-xs font-bold flex items-center gap-3 transition-all ${activeTab === 'book' ? 'bg-brand-gold text-black shadow-md' : 'text-zinc-300 hover:bg-white/5'}`}
                >
                  <i data-lucide="bookmark" className="w-4 h-4"></i>
                  <span>Book "No Godfather"</span>
                </button>
              </div>

              <div className="p-3 rounded-xl bg-black border border-[#232230] text-[11px] text-zinc-400 space-y-1 font-mono">
                <div>SEO Engine: Active</div>
                <div>Status: All Pages Indexed</div>
              </div>
            </aside>

            {/* TAB CONTENT AREA */}
            <main className="flex-1 overflow-y-auto p-8">
              
              {/* TAB 1: BLOGS & PUBLISHER (PRIMARY FOCUS) */}
              {activeTab === 'blogs' && (
                <div className="space-y-8 max-w-6xl mx-auto">
                  <div className="flex justify-between items-center border-b border-[#232230] pb-5">
                    <div>
                      <h2 className="text-2xl font-bold text-white">Blog & Article Publisher Studio</h2>
                      <p className="text-xs text-zinc-400">Create, edit, insert pictures, optimize SEO keywords, and toggle Publish vs Draft status.</p>
                    </div>
                    <button
                      onClick={handleCreateNewBlog}
                      className="px-5 py-2.5 rounded-full bg-brand-gold text-black font-bold text-xs flex items-center gap-2 hover:bg-brand-goldHover"
                    >
                      <i data-lucide="plus" className="w-4 h-4"></i>
                      <span>Create New Article</span>
                    </button>
                  </div>

                  {/* BLOG ARTICLES LIST & SELECTOR */}
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {cmsData.blogs.map((b) => (
                      <div
                        key={b.id}
                        onClick={() => setEditingBlog(b)}
                        className={`p-4 rounded-2xl border cursor-pointer transition-all ${editingBlog && editingBlog.id === b.id ? 'bg-[#181724] border-brand-gold shadow-lg shadow-brand-gold/10' : 'bg-[#14131B] border-[#232230] hover:border-white/20'}`}
                      >

                <div className="flex justify-between items-center border-b border-white/10 pb-3">
                  <h3 className="text-sm font-bold text-brand-gold font-mono">Add Picture Inside Blog Article</h3>
                  <button onClick={() => setShowImageModal(false)} className="text-zinc-400 hover:text-white">✕</button>
                </div>

                <div className="space-y-3">
                  <div>
                    <label className="text-[10px] text-zinc-400 font-mono">Upload Image File from Device:</label>
                    <div className="flex items-center gap-3 mt-1">
                      <label className="px-4 py-2.5 rounded-xl bg-brand-gold hover:bg-brand-goldHover text-black font-bold text-xs cursor-pointer transition-all flex items-center gap-2 shadow-md">
                        <i data-lucide="upload" className="w-3.5 h-3.5"></i>
                        <span>Choose Image File...</span>
                        <input
                          type="file"
                          accept="image/*"
                          className="hidden"
                          onChange={(e) => handleFileUpload(e.target.files[0], (dataUrl) => setInlineImgUrl(dataUrl))}
                        />
                      </label>
                      {inlineImgUrl && (
                        <img src={inlineImgUrl} alt="Preview" className="w-12 h-10 object-cover rounded-lg border border-brand-gold/40 shadow-md" />
                      )}
                    </div>
                  </div>

                  <div>
                    <label className="text-[10px] text-zinc-400 font-mono">Picture Caption Text:</label>
                    <input
                      type="text"
                      placeholder="e.g. Figure 1: Team media strategy session in Mumbai"
                      value={inlineImgCaption}
                      onChange={(e) => setInlineImgCaption(e.target.value)}
                      className="w-full p-2.5 rounded-xl bg-black border border-[#232230] text-white text-xs focus:border-brand-gold focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-[10px] text-zinc-400 font-mono">Image ALT Tag (SEO):</label>
                    <input
                      type="text"
                      placeholder="e.g. Yash Agarwal media campaign team"
                      value={inlineImgAlt}
                      onChange={(e) => setInlineImgAlt(e.target.value)}
                      className="w-full p-2.5 rounded-xl bg-black border border-[#232230] text-white text-xs font-mono focus:border-brand-gold focus:outline-none"
                    />
                  </div>
                </div>

                <div className="flex justify-end gap-3 pt-3 border-t border-white/10">
                  <button
                    onClick={() => setShowImageModal(false)}
                    className="px-4 py-2 rounded-full bg-white/10 text-xs font-bold"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={handleInsertInsidePicture}
                    className="px-5 py-2 rounded-full bg-brand-gold text-black font-bold text-xs"
                  >
                    Insert Picture Into Article
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
  </script>
</body>
</html>
