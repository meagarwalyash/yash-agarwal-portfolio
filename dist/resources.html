<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DRCV1573GQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    gtag('config', 'G-DRCV1573GQ');

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Growth Resources & Lead Magnets — Yash Agarwal (MeAgarwalYash)</title>
  <meta name="description" content="Free growth marketing checklists, zero-budget PR audits, Meta ad creative frameworks, and AI prompt guides by Yash Agarwal." />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#D4AF37',
              goldHover: '#B5942B',
              dark: '#0A090E',
              darkCard: '#14131B',
              border: 'rgba(212, 175, 55, 0.25)'
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Platform Scripts -->
  <script src="js/auth.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .gold-glow { box-shadow: 0 0 30px rgba(212, 175, 55, 0.2); }
    .glass-dark { background: rgba(20, 19, 27, 0.85); backdrop-filter: blur(16px); }
  </style>
</head>
<body class="bg-[#0A090E] text-white min-h-screen antialiased flex flex-col justify-between">

  <div id="root"></div>

  <!-- Load AI Assistant Widget -->
  <script src="js/ai-assistant.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function ResourcesApp() {
      const [resources, setResources] = useState([]);
      const [email, setEmail] = useState('');
      const [activeResource, setActiveResource] = useState(null);
      const [downloadSuccess, setDownloadSuccess] = useState(false);

      useEffect(() => {
        let savedData = localStorage.getItem('MAY_WEBSITE_CMS_DATA');
        if (savedData) {
          try {
            let cms = JSON.parse(savedData);
            if (cms.freeResources) setResources(cms.freeResources);
          } catch(e) {}
        } else {
          fetch('cmsData.json')
            .then(res => res.json())
            .then(data => {
              if (data.freeResources) setResources(data.freeResources);
            });
        }
      }, []);

      const handleClaimDownload = (e) => {
        e.preventDefault();
        if (!email.trim() || !email.includes('@')) {
          alert('Please enter a valid email address.');
          return;
        }

        // Save lead subscriber to CMS LocalStorage
        try {
          let savedData = localStorage.getItem('MAY_WEBSITE_CMS_DATA');
          let cms = savedData ? JSON.parse(savedData) : {};
          if (!cms.subscribers) cms.subscribers = [];
          cms.subscribers.unshift({
            email: email,
            date: new Date().toISOString().split('T')[0],
            source: activeResource ? activeResource.title : 'Free Lead Magnet Hub',
            status: 'active'
          });
          localStorage.setItem('MAY_WEBSITE_CMS_DATA', JSON.stringify(cms));
        } catch(e) {}

        setDownloadSuccess(true);
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          {/* Main Navigation */}
          <header className="sticky top-0 z-40 glass-dark border-b border-white/10 px-4 sm:px-8 py-4">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <a href="index.html" className="flex items-center gap-3">
                <img src="maylogo.png" alt="MAY Logo" className="h-9 w-auto brightness-150 drop-shadow-md" />
                <span className="text-xs font-bold text-brand-gold uppercase tracking-widest hidden sm:inline">Free Growth Resources</span>
              </a>
              
              <nav className="hidden md:flex items-center gap-6 text-xs font-semibold text-zinc-300">
                <a href="index.html" className="hover:text-brand-gold transition-colors">Home</a>
                <a href="store.html" className="hover:text-brand-gold transition-colors">Digital Store</a>
                <a href="blog.html" className="hover:text-brand-gold transition-colors">Blog</a>
                <a href="resources.html" className="text-brand-gold font-bold">Free Resources</a>
                <a href="speaking.html" className="hover:text-brand-gold transition-colors">Consulting</a>
                <a href="dashboard.html" className="hover:text-brand-gold transition-colors">My Dashboard</a>
              </nav>

              <a href="store.html" className="px-5 py-2.5 rounded-full bg-brand-gold text-black font-bold text-xs hover:bg-brand-goldHover transition-all gold-glow">
                Explore Paid Store →
              </a>
            </div>
          </header>

          {/* Hero Banner */}
          <section className="relative py-16 px-4 sm:px-8 overflow-hidden bg-gradient-to-b from-brand-darkCard to-[#0A090E] border-b border-white/10">
            <div className="max-w-4xl mx-auto text-center space-y-4 relative z-10">
              <span className="inline-block px-4 py-1.5 rounded-full bg-brand-gold/10 text-brand-gold text-xs font-bold uppercase tracking-widest border border-brand-gold/20">
                🎁 100% Free Executive Downloads
              </span>
              <h1 className="text-3xl sm:text-5xl font-extrabold text-white leading-tight">
                Free Growth Audits, Checklists & AI Prompts
              </h1>
              <p className="text-zinc-400 text-sm sm:text-base max-w-xl mx-auto">
                No credit card required. Exchange your work email to claim instant access to Yash Agarwal's internal growth frameworks.
              </p>
            </div>
          </section>

          {/* Resources Grid */}
          <main className="max-w-6xl mx-auto w-full px-4 sm:px-8 py-16 flex-1">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
              {resources.map(res => (
                <div key={res.id} className="bg-brand-darkCard rounded-3xl p-6 sm:p-8 border border-white/10 space-y-4 hover:border-brand-gold/50 transition-all flex flex-col justify-between gold-glow">
                  <div className="space-y-3">
                    <div className="flex justify-between items-center">
                      <span className="px-3 py-1 rounded-full bg-brand-gold/10 text-brand-gold text-[10px] font-bold uppercase border border-brand-gold/20">
                        {res.category}
                      </span>
                      <span className="text-[10px] font-mono text-zinc-500">
                        🔥 {res.downloadsCount || 1000}+ Downloads
                      </span>
                    </div>

                    <h3 className="text-xl font-bold text-white">{res.title}</h3>
                    <p className="text-xs text-zinc-400 leading-relaxed">{res.desc}</p>
                  </div>

                  <div className="pt-4 border-t border-white/10 flex items-center justify-between">
                    <span className="text-xs font-bold text-emerald-400 flex items-center gap-1">
                      ✓ Instant PDF Access
                    </span>
                    <button 
                      onClick={() => { setActiveResource(res); setDownloadSuccess(false); }}
                      className="px-6 py-2.5 rounded-full bg-brand-gold text-black font-bold text-xs hover:bg-brand-goldHover transition-all gold-glow"
                    >
                      Claim Free Download →
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </main>

          {/* Lead Capture Modal */}
          {activeResource && (
            <div className="fixed inset-0 z-50 glass-dark flex items-center justify-center p-4">
              <div className="bg-brand-darkCard border border-brand-gold/40 rounded-3xl max-w-md w-full p-6 sm:p-8 space-y-6 text-white relative shadow-2xl animate-fadeIn">
                <button 
                  onClick={() => setActiveResource(null)}
                  className="absolute top-6 right-6 text-zinc-400 hover:text-white text-lg font-bold"
                >
                  ✕
                </button>

                {!downloadSuccess ? (
                  <div className="space-y-4">
                    <span className="text-[10px] font-bold text-brand-gold uppercase tracking-widest">FREE INSTANT DOWNLOAD</span>
                    <h2 className="text-xl font-bold">{activeResource.title}</h2>
                    <p className="text-xs text-zinc-400">Where should we deliver your free PDF download link?</p>

                    <form onSubmit={handleClaimDownload} className="space-y-4 pt-2">
                      <div>
                        <label className="block text-[10px] font-bold text-zinc-300 uppercase tracking-wider mb-2">Work Email Address</label>
                        <input 
                          type="email"
                          required
                          placeholder="e.g. yash@enterprise.com"
                          value={email}
                          onChange={(e) => setEmail(e.target.value)}
                          className="w-full px-4 py-3 rounded-xl bg-black/60 border border-white/15 text-white text-sm focus:outline-none focus:border-brand-gold"
                        />
                      </div>

                      <button 
                        type="submit"
                        className="w-full py-3.5 rounded-full bg-brand-gold text-black font-bold text-xs hover:bg-brand-goldHover transition-all gold-glow"
                      >
                        Send Me The PDF Now →
                      </button>
                    </form>
                  </div>
                ) : (
                  <div className="text-center space-y-4 py-4 animate-fadeIn">
                    <div className="w-16 h-16 rounded-full bg-brand-gold/20 text-brand-gold flex items-center justify-center mx-auto text-3xl font-bold">✓</div>
                    <h3 className="text-xl font-bold">Download Unlocked!</h3>
                    <p className="text-xs text-zinc-300">We have registered <strong>{email}</strong> for future growth updates.</p>
                    <a 
                      href={activeResource.fileUrl || "#"}
                      download
                      onClick={() => alert(`Downloading ${activeResource.title}...`)}
                      className="inline-block w-full py-3.5 rounded-full bg-brand-gold text-black font-bold text-xs hover:bg-brand-goldHover gold-glow"
                    >
                      Click Here to Download PDF File →
                    </a>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* EXPANDED FOOTER */}
          <footer className="border-t border-white/10 bg-black text-zinc-400">
            <div className="max-w-7xl mx-auto px-6 sm:px-12 py-14">
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-8 mb-10 text-left">
                {/* Brand */}
                <div className="col-span-2 sm:col-span-1 space-y-3">
                  <img src="maylogo.png" alt="MAY Logo" className="h-10 w-auto object-contain brightness-150 contrast-125 filter drop-shadow-[0_0_12px_rgba(212,175,55,0.5)]" />
                  <p className="text-xs leading-relaxed">Executive Growth Architect. Author. CMO. Speaker. Built on first principles, not favours.</p>
                  <div className="flex gap-2">
                    {['linkedin', 'instagram', 'youtube', 'twitter'].map(icon => (
                      <a key={icon} href={`https://${icon}.com/meagarwalyash`} target="_blank"
                        className="w-8 h-8 rounded-lg flex items-center justify-center text-xs transition-all hover:text-brand-gold bg-white/5 hover:bg-white/10"
                      >
                        <i data-lucide={icon} className="w-3.5 h-3.5"></i>
                      </a>
                    ))}
                  </div>
                </div>

                {/* Sections */}
                <div className="space-y-3">
                  <div className="text-xs font-bold text-brand-gold uppercase tracking-widest">Navigate</div>
                  {[['store.html', '🛍️ Digital Store'], ['resources.html', '🎁 Free Resources'], ['blog.html', '✍️ Growth Essays'], ['speaking.html', '💼 Consulting'], ['dashboard.html', '👤 Customer Dashboard']].map(([href, label]) => (
                    <a key={href} href={href} className="block text-xs hover:text-brand-gold transition-colors font-semibold">{label}</a>
                  ))}
                </div>
                <div className="space-y-3">
                  <div className="text-xs font-bold text-brand-gold uppercase tracking-widest">Work</div>
                  {[['index.html#impact', 'Impact Dashboard'], ['index.html#journey', 'My Journey'], ['media.html', 'Press & Media'], ['index.html#tv', 'Videos & Podcasts'], ['index.html#book', 'No Godfather Book']].map(([href, label]) => (
                    <a key={href} href={href} className="block text-xs hover:text-brand-gold transition-colors">{label}</a>
                  ))}
                </div>
                <div className="space-y-3">
                  <div className="text-xs font-bold text-brand-gold uppercase tracking-widest">Contact</div>
                  <a href="mailto:yash@meagarwalyash.com" className="block text-xs hover:text-brand-gold transition-colors">yash@meagarwalyash.com</a>
                  <a href="https://linkedin.com/in/meagarwalyash" target="_blank" className="block text-xs hover:text-brand-gold transition-colors">LinkedIn</a>
                  <a href="https://instagram.com/meagarwalyash" target="_blank" className="block text-xs hover:text-brand-gold transition-colors">Instagram</a>
                  <a href="https://youtube.com/@meagarwalyash" target="_blank" className="block text-xs hover:text-brand-gold transition-colors">YouTube Channel</a>
                  <div className="text-xs mt-2 text-zinc-500">Mumbai, India 🇮🇳</div>
                </div>
              </div>

              {/* Bottom bar */}
              <div className="pt-6 border-t border-white/10 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs">
                <div>© 2026 Yash Agarwal (@MeAgarwalYash). All Rights Reserved.</div>
                <div className="text-brand-gold font-bold">MUMBAI, INDIA • LIVE IST</div>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ResourcesApp />);
  </script>
</body>
</html>
