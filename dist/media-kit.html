    const { useState, useEffect, useRef } = React;

    function MediaKitApp() {
      const [cmsData, setCmsData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [amazonDrawerOpen, setAmazonDrawerOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState("");
      const [searchCategory, setSearchCategory] = useState("All");

      const [selectedVideoShort, setSelectedVideoShort] = useState(null);
      const [activeProposalModal, setActiveProposalModal] = useState(false);
      const [activeProposalTier, setActiveProposalTier] = useState("Multi-Platform Growth Blitz");
      
      // Gated Lead Download Modal State
      const [gatedDownloadModal, setGatedDownloadModal] = useState(null); // 'rate-card' | 'collab-guide'
      const [leadName, setLeadName] = useState("");
      const [leadPhone, setLeadPhone] = useState("");
      const [leadEmail, setLeadEmail] = useState("");
      const [leadCompany, setLeadCompany] = useState("");
      const [leadBudget, setLeadBudget] = useState("₹2,00,000 - ₹5,00,000");
      const [leadMessage, setLeadMessage] = useState("");
      const [leadSubmitting, setLeadSubmitting] = useState(false);
      const [leadSuccessMsg, setLeadSuccessMsg] = useState("");
      const [pdfGenerating, setPdfGenerating] = useState(false);

      useEffect(() => {
        // Fetch CMS Data
        const savedData = localStorage.getItem('MAY_WEBSITE_CMS_DATA');
        if (savedData) {
          try {
            setCmsData(JSON.parse(savedData));
            setLoading(false);
          } catch(e) {
            loadFallbackCms();
          }
        } else {
          loadFallbackCms();
        }

        // Auto-fill existing user lead info if available
        try {
          const storedUser = JSON.parse(localStorage.getItem('may_lead_user') || '{}');
          if (storedUser.name) setLeadName(storedUser.name);
          if (storedUser.phone) setLeadPhone(storedUser.phone);
          if (storedUser.email) setLeadEmail(storedUser.email);
        } catch(e) {}

        if (window.lucide) {
          setTimeout(() => window.lucide.createIcons(), 200);
        }
      }, []);

      const loadFallbackCms = () => {
        fetch('/cmsData.json')
          .then(res => res.json())
          .then(data => {
            setCmsData(data);
            setLoading(false);
            if (window.lucide) setTimeout(() => window.lucide.createIcons(), 200);
          })
          .catch(() => {
            setLoading(false);
          });
      };

      useEffect(() => {
        if (window.lucide && !loading) {
          window.lucide.createIcons();
        }
      }, [loading, activeAudienceTab, selectedCampaignModal, activeProposalModal, gatedDownloadModal]);

      // Dynamic PDF Generation Engine (Exports full branded executive Media Kit)
      const handleGenerateDynamicPdf = () => {
        setPdfGenerating(true);
        const element = document.getElementById('printable-media-kit');
        
        if (!element) {
          window.print();
          setPdfGenerating(false);
          return;
        }

        const opt = {
          margin: 8,
          filename: 'Yash_Agarwal_Official_Media_Kit_2026.pdf',
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true, backgroundColor: '#0A090E' },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        if (window.html2pdf) {
          window.html2pdf().set(opt).from(element).save().then(() => {
            setPdfGenerating(false);
          }).catch(() => {
            window.print();
            setPdfGenerating(false);
          });
        } else {
          window.print();
          setPdfGenerating(false);
        }
      };

      // Handle Gated Lead Capture Submission
      const handleGatedLeadSubmit = async (e) => {
        e.preventDefault();
        if (!leadName || !leadPhone || !leadEmail) return;
        setLeadSubmitting(true);

        const payload = {
          id: 'lead_' + Date.now(),
          customerName: leadName.trim(),
          name: leadName.trim(),
          phone: leadPhone.trim(),
          customerEmail: leadEmail.trim().toLowerCase(),
          email: leadEmail.trim().toLowerCase(),
          company: leadCompany.trim() || 'Brand Partner',
          budget: leadBudget,
          message: leadMessage,
          productId: gatedDownloadModal || 'media_kit_proposal',
          productName: gatedDownloadModal === 'rate-card' ? 'Official Sponsorship Rate Card (PDF)' : (gatedDownloadModal === 'collab-guide' ? 'Brand Collaboration Playbook (PDF)' : 'Brand Partnership Proposal Inquiry'),
          source: 'Interactive Media Kit Page',
          createdAt: new Date().toISOString(),
          date: new Date().toISOString().split('T')[0],
          status: 'Active High-Intent Lead'
        };

        // 1. Save locally in browser
        try {
          localStorage.setItem('may_lead_user', JSON.stringify(payload));
          const existingLeads = JSON.parse(localStorage.getItem('may_leads') || '[]');
          existingLeads.unshift(payload);
          localStorage.setItem('may_leads', JSON.stringify(existingLeads));

          let savedData = localStorage.getItem('MAY_WEBSITE_CMS_DATA');
          let cms = savedData ? JSON.parse(savedData) : {};
          if (!cms.waitlistData) cms.waitlistData = [];
          if (!cms.subscribers) cms.subscribers = [];
          cms.waitlistData.unshift(payload);
          cms.subscribers.unshift(payload);
          localStorage.setItem('MAY_WEBSITE_CMS_DATA', JSON.stringify(cms));
        } catch(err) {}

        // 2. Post to backend server
        try {
          await fetch('/api/leads/capture', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        } catch(err) {}

        setLeadSubmitting(false);
        setLeadSuccessMsg('✓ Verified! Access Granted & Lead Stored in CMS.');

        setTimeout(() => {
          const downloadType = gatedDownloadModal;
          setGatedDownloadModal(null);
          setActiveProposalModal(false);
          setLeadSuccessMsg('');

          if (downloadType === 'rate-card' || downloadType === 'collab-guide') {
            handleGenerateDynamicPdf();

            alert('Thank you! Your brand partnership inquiry has been received. Yash Agarwal will respond within 24 hours.');
