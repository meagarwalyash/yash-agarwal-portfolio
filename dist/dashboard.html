<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DRCV1573GQ"></script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Executive Customer Portal — Yash Agarwal (MeAgarwalYash)</title>
  <meta name="description" content="Manage your purchased courses, masterclasses, digital SOPs, invoices, and downloads on the MAY platform." />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#D4AF37',
              goldHover: '#B5942B',
              dark: '#0A090E',
              darkCard: '#14131B',
              border: 'rgba(212, 175, 55, 0.25)'
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin></script>

  <!-- Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Platform Scripts -->
  <script src="js/auth.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .gold-glow { box-shadow: 0 0 30px rgba(212, 175, 55, 0.25); }
    .glass-dark { background: rgba(20, 19, 27, 0.85); backdrop-filter: blur(16px); }
  </style>
</head>
<body class="bg-[#0A090E] text-white min-h-screen antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function DashboardApp() {
      const [user, setUser] = useState(null);
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'register' | 'forgot'
      const [activeTab, setActiveTab] = useState('courses'); // 'courses' | 'downloads' | 'orders' | 'profile'
      const [cmsData, setCmsData] = useState(null);

      // Auth Form States
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authName, setAuthName] = useState('');
      const [authPhone, setAuthPhone] = useState('');
      const [authGst, setAuthGst] = useState('');
      const [authMsg, setAuthMsg] = useState('');
      const [authError, setAuthError] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);

      // Profile edit states
      const [profileName, setProfileName] = useState('');
      const [profilePhone, setProfilePhone] = useState('');
      const [profileGst, setProfileGst] = useState('');
      const [currentPass, setCurrentPass] = useState('');
      const [newPass, setNewPass] = useState('');
      const [profileStatusMsg, setProfileStatusMsg] = useState('');

      useEffect(() => {
        // Read active session (NO hardcoded demo data)
        const currentUser = window.MAY_AuthEngine ? window.MAY_AuthEngine.getCurrentUser() : null;
        if (currentUser) {
          setUser(currentUser);
          setProfileName(currentUser.name || '');
          setProfilePhone(currentUser.phone || '');
          setProfileGst(currentUser.gst || '');
        }

        // Load CMS data
        const saved = localStorage.getItem('MAY_WEBSITE_CMS_DATA');
        if (saved) {
          try { setCmsData(JSON.parse(saved)); } catch(e) {}
        }

        if (window.lucide) window.lucide.createIcons();
      }, []);

      const handleLogin = async (e) => {
        e.preventDefault();
        setAuthMsg(''); setAuthError('');
        if (!authEmail.trim() || !authPassword.trim()) {
          setAuthError('Please enter your email and password.');
          return;
        }

        setIsSubmitting(true);
        const res = await window.MAY_AuthEngine.login(authEmail, authPassword);
        setIsSubmitting(false);

        if (res.success) {
          setUser(res.user);
          setProfileName(res.user.name || '');
          setProfilePhone(res.user.phone || '');
          setProfileGst(res.user.gst || '');
        } else {
          setAuthError(res.message);
        }
      };

      const handleRegister = async (e) => {
        e.preventDefault();
        setAuthMsg(''); setAuthError('');
        if (!authName.trim() || !authEmail.trim() || !authPassword.trim()) {
          setAuthError('Please fill in all required fields (Name, Email, Password).');
          return;
        }

        setIsSubmitting(true);
        const res = await window.MAY_AuthEngine.register(authName, authEmail, authPassword, authPhone, authGst);
        setIsSubmitting(false);

        if (res.success) {
          setUser(res.user);
          setProfileName(res.user.name || '');
          setProfilePhone(res.user.phone || '');
          setProfileGst(res.user.gst || '');
        } else {
          setAuthError(res.message);
        }
      };

      const handleForgotPassword = async (e) => {
        e.preventDefault();
        setAuthMsg(''); setAuthError('');
        if (!authEmail.trim()) {
          setAuthError('Please enter your email address.');
          return;
        }

        setIsSubmitting(true);
        const res = await window.MAY_AuthEngine.forgotPassword(authEmail);
        setIsSubmitting(false);

        if (res.success) {
          setAuthMsg(res.message);
        } else {
          setAuthError(res.message);
        }
      };

      const handleLogout = () => {
        if (window.MAY_AuthEngine) window.MAY_AuthEngine.logout();
        setUser(null);
      };

      const handleSaveProfile = async (e) => {
        e.preventDefault();
        setProfileStatusMsg('');
        const res = await window.MAY_AuthEngine.updateProfile(profileName, profilePhone, profileGst);
        if (res.success) {
          setUser(res.user);
          setProfileStatusMsg('✓ Profile details updated successfully.');
        } else {
          setProfileStatusMsg('❌ Error updating profile: ' + res.message);
        }
      };

      // AUTHENTICATION PORTAL (IF NOT LOGGED IN)
      if (!user) {
        return (
          <div className="min-h-screen flex flex-col justify-between p-4 sm:p-8 relative overflow-hidden">
            <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[400px] bg-brand-gold/10 rounded-full blur-[140px] pointer-events-none"></div>

            {/* HEADER */}
            <header className="max-w-7xl mx-auto w-full flex items-center justify-between py-4 border-b border-white/10 relative z-10">
              <a href="index.html" className="flex items-center gap-3">
                <img src="maylogo.png" alt="MAY Logo" className="h-10 w-auto brightness-150 drop-shadow-md" />
                <span className="text-xs font-bold text-brand-gold uppercase tracking-wider hidden sm:inline">Executive Portal</span>
              </a>
              <div className="flex items-center gap-4 text-xs font-bold">
                <a href="index.html" className="text-zinc-300 hover:text-brand-gold">← Return Home</a>
                <a href="store.html" className="text-zinc-300 hover:text-brand-gold">Digital Store</a>
              </div>
            </header>

            {/* AUTH CARD CONTAINER */}
            <main className="max-w-md mx-auto w-full py-12 relative z-10 flex-1 flex flex-col justify-center">
              <div className="glass-dark p-8 sm:p-10 rounded-3xl border border-brand-gold/30 gold-glow space-y-6">
                
                {/* Auth Mode Toggle Tabs */}
                <div className="flex border-b border-white/15 pb-4 justify-around text-sm font-bold">
                  <button
                    onClick={() => { setAuthMode('login'); setAuthError(''); setAuthMsg(''); }}
                    className={`pb-2 transition-all ${authMode === 'login' ? 'text-brand-gold border-b-2 border-brand-gold' : 'text-zinc-400 hover:text-white'}`}
                  >
                    Customer Sign In
                  </button>
                  <button
                    onClick={() => { setAuthMode('register'); setAuthError(''); setAuthMsg(''); }}
                    className={`pb-2 transition-all ${authMode === 'register' ? 'text-brand-gold border-b-2 border-brand-gold' : 'text-zinc-400 hover:text-white'}`}
                  >
                    Create Account
                  </button>
                </div>

                {authMsg && <div className="p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-semibold">{authMsg}</div>}
                {authError && <div className="p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-semibold">{authError}</div>}

                {/* SIGN IN FORM */}
                {authMode === 'login' && (
                  <form onSubmit={handleLogin} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-zinc-300 uppercase mb-1">Email Address</label>
                      <input
                        type="email"
                        required
                        placeholder="you@company.com"
                        value={authEmail}
                        onChange={e => setAuthEmail(e.target.value)}
                        className="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/15 text-white text-sm focus:border-brand-gold focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-zinc-300 uppercase mb-1">Password</label>
                      <input
                        type="password"
                        required
                        placeholder="••••••••"
                        value={authPassword}
                        onChange={e => setAuthPassword(e.target.value)}
                        className="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/15 text-white text-sm focus:border-brand-gold focus:outline-none"
                      />
                    </div>
                    <div className="flex items-center justify-between text-xs">
                      <label className="flex items-center gap-2 text-zinc-400 cursor-pointer">
                        <input type="checkbox" defaultChecked className="rounded accent-brand-gold" />
                        <span>Remember Me</span>
                      </label>
                      <button
                        type="button"
                        onClick={() => { setAuthMode('forgot'); setAuthError(''); setAuthMsg(''); }}
                        className="text-brand-gold hover:underline font-semibold"
                      >
                        Forgot Password?
                      </button>
                    </div>
                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className="w-full py-3.5 rounded-full bg-brand-gold hover:bg-brand-goldHover text-black font-bold text-sm shadow-lg transition-all"
                    >
                      {isSubmitting ? 'Authenticating...' : 'Sign In to Portal →'}
                    </button>
                  </form>
                )}

                {/* REGISTER FORM */}
                {authMode === 'register' && (
                  <form onSubmit={handleRegister} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-zinc-300 uppercase mb-1">Full Name *</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. Vikram Sharma"
                        value={authName}
                        onChange={e => setAuthName(e.target.value)}
                        className="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/15 text-white text-sm focus:border-brand-gold focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-zinc-300 uppercase mb-1">Email Address *</label>
                      <input
                        type="email"
                        required
                        placeholder="you@company.com"
                        value={authEmail}
                        onChange={e => setAuthEmail(e.target.value)}
                        className="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/15 text-white text-sm focus:border-brand-gold focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-zinc-300 uppercase mb-1">Password *</label>
                      <input
                        type="password"
                        required
                        placeholder="Create strong password"
                        value={authPassword}
                        onChange={e => setAuthPassword(e.target.value)}
                        className="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/15 text-white text-sm focus:border-brand-gold focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-zinc-300 uppercase mb-1">Phone Number (Optional)</label>
                      <input
                        type="tel"
                        placeholder="+91 98765 43210"
                        value={authPhone}
                        onChange={e => setAuthPhone(e.target.value)}
                        className="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/15 text-white text-sm focus:border-brand-gold focus:outline-none"
                      />
                    </div>
                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className="w-full py-3.5 rounded-full bg-brand-gold hover:bg-brand-goldHover text-black font-bold text-sm shadow-lg transition-all"
                    >
                      {isSubmitting ? 'Creating Account...' : 'Complete Sign Up →'}
                    </button>
                  </form>
                )}

                {/* FORGOT PASSWORD FORM */}
                {authMode === 'forgot' && (
                  <form onSubmit={handleForgotPassword} className="space-y-4">
                    <p className="text-xs text-zinc-400">Enter your registered email address and we will send password reset instructions.</p>
                    <div>
                      <label className="block text-xs font-bold text-zinc-300 uppercase mb-1">Email Address</label>
                      <input
                        type="email"
                        required
                        placeholder="you@company.com"
                        value={authEmail}
                        onChange={e => setAuthEmail(e.target.value)}
                        className="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/15 text-white text-sm focus:border-brand-gold focus:outline-none"
                      />
                    </div>
                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className="w-full py-3.5 rounded-full bg-brand-gold hover:bg-brand-goldHover text-black font-bold text-sm shadow-lg transition-all"
                    >
                      {isSubmitting ? 'Sending Link...' : 'Send Reset Link →'}
                    </button>
                    <div className="text-center pt-2">
                      <button
                        type="button"
                        onClick={() => setAuthMode('login')}
                        className="text-xs text-zinc-400 hover:text-white"
                      >
                        ← Back to Sign In
                      </button>
                    </div>
                  </form>
                )}

              </div>
            </main>

            {/* EXPANDED FOOTER */}
            <footer className="border-t border-white/10 bg-black text-zinc-400 mt-12 relative z-10">
              <div className="max-w-7xl mx-auto px-6 py-8 text-center text-xs">
                © 2026 Yash Agarwal (@MeAgarwalYash). All Rights Reserved. MUMBAI, INDIA • LIVE IST
              </div>
            </footer>
          </div>
        );
      }

      // LOGGED-IN CUSTOMER DASHBOARD
      const userOrders = user.orders || [];
      const userCourses = user.purchasedCourses || [];
      const userProducts = user.purchasedProducts || [];

      return (
        <div className="min-h-screen flex flex-col justify-between p-4 sm:p-8 relative overflow-hidden">
          <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[900px] h-[500px] bg-brand-gold/10 rounded-full blur-[150px] pointer-events-none"></div>

          {/* Header Navigation */}
          <header className="max-w-7xl mx-auto w-full flex items-center justify-between py-4 border-b border-white/10 mb-8 relative z-10">
            <div className="flex items-center gap-6">
              <a href="index.html" className="flex items-center gap-3">
                <img src="maylogo.png" alt="MAY Logo" className="h-10 w-auto brightness-150 drop-shadow-md" />
                <span className="text-xs font-bold text-brand-gold uppercase tracking-wider hidden sm:inline">Customer Portal</span>
              </a>
              <nav className="hidden md:flex items-center gap-4 text-xs font-bold text-zinc-300">
                <a href="index.html" className="hover:text-brand-gold">Home</a>
                <a href="store.html" className="hover:text-brand-gold">Digital Store</a>
                <a href="resources.html" className="hover:text-brand-gold">Free Resources</a>
                <a href="blog.html" className="hover:text-brand-gold">Blog</a>
              </nav>
            </div>
            <div className="flex items-center gap-4">
              <span className="text-xs font-semibold text-zinc-300 hidden md:inline">Welcome, <strong>{user.name}</strong></span>
              <button
                onClick={handleLogout}
                className="px-4 py-2 rounded-full border border-white/20 text-xs font-bold hover:bg-white/10 transition-colors"
              >
                Sign Out 🚪
              </button>
            </div>
          </header>

          {/* Dashboard Main Container */}
          <main className="max-w-7xl mx-auto w-full space-y-8 relative z-10 flex-1">
            
            {/* User Overview Header Banner */}
            <div className="glass-dark rounded-3xl p-6 sm:p-8 border border-brand-gold/30 flex flex-col md:flex-row items-start md:items-center justify-between gap-6 gold-glow">
              <div className="flex items-center gap-5">
                <div className="w-16 h-16 rounded-full bg-brand-gold/20 text-brand-gold flex items-center justify-center font-bold text-2xl border border-brand-gold/40">
                  {user.name ? user.name.charAt(0) : 'U'}
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-2xl font-bold">{user.name}</h1>
                    <span className="px-3 py-0.5 rounded-full text-[10px] font-bold text-black bg-brand-gold uppercase">{user.memberTier || 'Pro Executive'}</span>
                  </div>
                  <p className="text-xs text-zinc-400 mt-1">{user.email} • Customer ID: {user.id}</p>
                </div>
              </div>

              <div className="flex flex-wrap gap-3">
                <a
                  href="store.html"
                  className="px-6 py-3 rounded-full bg-brand-gold hover:bg-brand-goldHover text-black font-bold text-xs transition-all shadow-md flex items-center gap-2"
                >
                  <span>Browse Digital Marketplace →</span>
                </a>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="flex border-b border-white/10 gap-6 overflow-x-auto pb-2">
              {[
                { id: 'subscriptions', label: '🚀 Active Retainers & Onboarding Tracker' },
                { id: 'courses', label: '🎓 My Courses & Masterclasses' },
                { id: 'downloads', label: '🛍️ Digital Store Downloads' },
                { id: 'orders', label: '📜 Order & Invoice History' },
                { id: 'profile', label: '👤 Account & Settings' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`pb-3 text-sm font-bold transition-colors whitespace-nowrap ${activeTab === tab.id ? 'text-brand-gold border-b-2 border-brand-gold' : 'text-zinc-400 hover:text-white'}`}
                >
                  {tab.label}
                </button>
              ))}
            </div>

            {/* TAB: ACTIVE SUBSCRIPTIONS & ONBOARDING TRACKER */}
            {activeTab === 'subscriptions' && (
              <div className="space-y-6">
                <h2 className="text-xl font-bold">Active Management Packages & Onboarding Status</h2>

                {(!user.activeSubscriptions || user.activeSubscriptions.length === 0) ? (
                  <div className="glass-dark p-10 rounded-3xl border border-white/10 text-center space-y-4">
                    <div className="text-4xl">🚀</div>
                    <h3 className="text-lg font-bold">No Active Growth Packages</h3>
                    <p className="text-xs text-zinc-400 max-w-md mx-auto">Explore social media management, performance ad scaling, and executive PR packages to partner with Yash Agarwal.</p>
                    <a href="index.html#pricing" className="inline-block px-6 py-3 rounded-full bg-brand-gold text-black font-bold text-xs">View Management Packages & Pricing →</a>
                  </div>
                ) : (
                  <div className="space-y-6">
                    {user.activeSubscriptions.map((sub, idx) => (
                      <div key={idx} className="glass-dark p-6 sm:p-8 rounded-3xl border border-brand-gold/40 space-y-6 shadow-xl gold-glow">
                        
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-white/10 pb-4">
                          <div>
                            <span className="text-[10px] font-mono text-brand-gold font-bold uppercase tracking-widest">ACTIVE SERVICE PACKAGE</span>
                            <h3 className="text-2xl font-bold text-white mt-0.5">{sub.packageName}</h3>
                            <p className="text-xs text-zinc-400">{sub.companyName || user.name} • Order: {sub.orderId}</p>
                          </div>
                          <div className="text-right">
                            <div className="text-xl font-extrabold text-brand-gold">₹{(sub.monthlyPrice || 150000).toLocaleString()} <span className="text-xs text-zinc-400">/ mo</span></div>
                            <span className="px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-400 font-bold text-[10px] uppercase">STATUS: {sub.status || 'ACTIVE'}</span>
                          </div>
                        </div>

                        {/* ONBOARDING LIFECYCLE PROGRESS TRACKER */}
                        <div className="space-y-4">
                          <div className="flex justify-between items-center text-xs">
                            <span className="font-bold text-zinc-300">Client Onboarding & Execution Progress:</span>
                            <span className="font-mono text-brand-gold font-bold">Current Stage: {sub.onboardingStatus || 'Kickoff Pending'}</span>
                          </div>

                          {/* Progress Bar Steps */}
                          <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-2">
                            {[
                              '1. Payment Verified',
                              '2. Kickoff Pending',
                              '3. Strategy Call',
                              '4. Assets Collected',
                              '5. Design Started',
                              '6. Campaign Setup',
                              '7. Ads Ready',
                              '8. Monthly Reporting'
                            ].map((stepLabel, sIdx) => {
                              const currentStepNum = sub.onboardingStep || 2;
                              const isPassed = sIdx + 1 <= currentStepNum;
                              const isCurrent = sIdx + 1 === currentStepNum;

                              return (
                                <div key={sIdx} className={`p-2.5 rounded-xl border text-center text-[10px] font-bold space-y-1 ${isCurrent ? 'bg-brand-gold/20 border-brand-gold text-brand-gold shadow-md' : isPassed ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400' : 'bg-white/5 border-white/10 text-zinc-500'}`}>
                                  <div>{stepLabel}</div>
                                  <div className="text-[9px]">{isPassed ? '✓ Done' : isCurrent ? '⏳ In Progress' : 'Pending'}</div>
                                </div>
                              );
                            })}
                          </div>
                        </div>

                        {/* Action Buttons */}
                        <div className="flex flex-wrap gap-3 pt-2 border-t border-white/10">
                          <a
                            href="https://calendly.com"
                            target="_blank"
                            rel="noopener noreferrer"
                            className="px-5 py-2.5 rounded-full bg-brand-gold text-black font-bold text-xs hover:bg-brand-goldHover transition-all flex items-center gap-1.5"
                          >
                            <span>Schedule Kickoff Call 📅</span>
                          </a>
                          <a
                            href={`mailto:yash@meagarwalyash.com?subject=Inquiry regarding Order ${sub.orderId}`}
                            className="px-5 py-2.5 rounded-full bg-white/10 text-white font-bold text-xs hover:bg-white/20 transition-all flex items-center gap-1.5"
                          >
                            <span>Contact Direct Strategist ✉️</span>
                          </a>
                        </div>

                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* TAB 1: COURSES */}
            {activeTab === 'courses' && (
              <div className="space-y-6">
                <h2 className="text-xl font-bold">Enrolled Courses & Masterclasses</h2>

                {userCourses.length === 0 ? (
                  <div className="glass-dark p-10 rounded-3xl border border-white/10 text-center space-y-4">
                    <div className="text-4xl">📚</div>
                    <h3 className="text-lg font-bold">No Courses Enrolled Yet</h3>
                    <p className="text-xs text-zinc-400 max-w-md mx-auto">Explore executive masterclasses and enrollment programs to scale your authority and growth performance.</p>
                    <a href="store.html" className="inline-block px-6 py-3 rounded-full bg-brand-gold text-black font-bold text-xs">Explore Executive Masterclasses →</a>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {userCourses.map((cId) => (
                      <div key={cId} className="glass-dark p-6 rounded-3xl border border-white/10 space-y-4 flex flex-col justify-between">
                        <div className="space-y-2">
                          <span className="text-[10px] font-bold text-brand-gold uppercase tracking-wider">EXECUTIVE MASTERCLASS</span>
                          <h3 className="text-lg font-bold">The Personal Brand & Executive PR Masterclass</h3>
                          <p className="text-xs text-zinc-400">12 High-Definition Executive Video Modules with Swipe Files.</p>
                        </div>
                        <a href="course-player.html" className="inline-block w-full py-3 text-center rounded-xl bg-brand-gold text-black font-bold text-xs hover:bg-brand-goldHover transition-all">
                          Resume Course Modules →
                        </a>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* TAB 2: DOWNLOADS */}
            {activeTab === 'downloads' && (
              <div className="space-y-6">
                <h2 className="text-xl font-bold">Digital Store Downloads & Access Keys</h2>

                {userProducts.length === 0 ? (
                  <div className="glass-dark p-10 rounded-3xl border border-white/10 text-center space-y-4">
                    <div className="text-4xl">📥</div>
                    <h3 className="text-lg font-bold">No Digital Downloads Available</h3>
                    <p className="text-xs text-zinc-400 max-w-md mx-auto">Purchased e-books, prompt packs, and SOP swipe files will appear here instantly for secure download.</p>
                    <a href="store.html" className="inline-block px-6 py-3 rounded-full bg-brand-gold text-black font-bold text-xs">Browse Digital Store →</a>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {userProducts.map((pId) => (
                      <div key={pId} className="glass-dark p-6 rounded-3xl border border-white/10 space-y-4 flex flex-col justify-between">
                        <div className="space-y-2">
                          <span className="text-[10px] font-bold text-emerald-400 uppercase tracking-wider">VERIFIED DIGITAL ASSET</span>
                          <h3 className="text-base font-bold">Digital Product Asset #{pId}</h3>
                          <p className="text-xs text-zinc-400">Authorized lifetime download granted for {user.email}.</p>
                        </div>
                        <a
                          href={`/api/download/${pId}?email=${encodeURIComponent(user.email)}`}
                          download
                          className="inline-block w-full py-3 text-center rounded-xl bg-white/10 hover:bg-white/20 text-brand-gold font-bold text-xs border border-brand-gold/30 transition-all"
                        >
                          Secure Download File 📥
                        </a>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* TAB 3: ORDERS & INVOICES */}
            {activeTab === 'orders' && (
              <div className="space-y-6">
                <h2 className="text-xl font-bold">Order History & Official GST Invoices</h2>

                {userOrders.length === 0 ? (
                  <div className="glass-dark p-10 rounded-3xl border border-white/10 text-center space-y-4">
                    <div className="text-4xl">📜</div>
                    <h3 className="text-lg font-bold">No Completed Orders</h3>
                    <p className="text-xs text-zinc-400 max-w-md mx-auto">Your Razorpay checkout orders and tax invoices will be listed here automatically.</p>
                  </div>
                ) : (
                  <div className="glass-dark rounded-3xl border border-white/10 overflow-hidden">
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs text-zinc-300">
                        <thead className="bg-white/5 text-zinc-400 uppercase font-bold border-b border-white/10">
                          <tr>
                            <th className="p-4">Order ID</th>
                            <th className="p-4">Item Title</th>
                            <th className="p-4">Amount</th>
                            <th className="p-4">Payment ID</th>
                            <th className="p-4">Date</th>
                            <th className="p-4">Invoice</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-white/5">
                          {userOrders.map((ord, idx) => (
                            <tr key={idx} className="hover:bg-white/5 transition-colors">
                              <td className="p-4 font-mono text-brand-gold font-bold">{ord.orderId}</td>
                              <td className="p-4 font-bold text-white">{ord.itemTitle}</td>
                              <td className="p-4 font-bold text-brand-gold">₹{parseFloat(ord.amount).toLocaleString()}</td>
                              <td className="p-4 font-mono text-zinc-400">{ord.paymentId || 'Captured'}</td>
                              <td className="p-4 text-zinc-400">{ord.timestamp ? new Date(ord.timestamp).toLocaleDateString() : 'Recent'}</td>
                              <td className="p-4">
                                <button
                                  onClick={() => alert(`Official Tax Invoice: ${ord.invoiceNo || 'INV-2026-94810'}\nIssued To: ${user.name}\nAmount: ₹${ord.amount} (Incl. 18% GST)`)}
                                  className="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-brand-gold font-bold text-[11px]"
                                >
                                  Invoice 📄
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* TAB 4: PROFILE & SETTINGS */}
            {activeTab === 'profile' && (
              <div className="glass-dark p-6 sm:p-8 rounded-3xl border border-white/10 space-y-6">
                <h2 className="text-xl font-bold">Customer Account Settings</h2>

                {profileStatusMsg && <div className="p-3 rounded-xl bg-white/5 border border-brand-gold/30 text-brand-gold text-xs font-semibold">{profileStatusMsg}</div>}

                <form onSubmit={handleSaveProfile} className="space-y-4 max-w-lg">
                  <div>
                    <label className="block text-xs font-bold text-zinc-400 uppercase mb-1">Full Name</label>
                    <input
                      type="text"
                      value={profileName}
                      onChange={e => setProfileName(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/15 text-white text-sm"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-zinc-400 uppercase mb-1">Email Address</label>
                    <input
                      type="email"
                      readOnly
                      value={user.email}
                      className="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/15 text-zinc-500 cursor-not-allowed text-sm"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-zinc-400 uppercase mb-1">Phone Number</label>
                    <input
                      type="tel"
                      value={profilePhone}
                      onChange={e => setProfilePhone(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/15 text-white text-sm"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-zinc-400 uppercase mb-1">GST Identification Number (Optional)</label>
                    <input
                      type="text"
                      value={profileGst}
                      onChange={e => setProfileGst(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/15 text-white text-sm uppercase"
                    />
                  </div>
                  <button type="submit" className="px-6 py-3 rounded-full bg-brand-gold text-black font-bold text-xs hover:bg-brand-goldHover transition-all">
                    Save Profile Details
                  </button>
                </form>
              </div>
            )}

          </main>

          {/* EXPANDED FOOTER */}
          <footer className="border-t border-white/10 bg-black text-zinc-400 mt-12 relative z-10">
            <div className="max-w-7xl mx-auto px-6 sm:px-12 py-14">
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-8 mb-10 text-left">
                <div className="col-span-2 sm:col-span-1 space-y-3">
                  <img src="maylogo.png" alt="MAY Logo" className="h-10 w-auto object-contain brightness-150 contrast-125 filter drop-shadow-[0_0_12px_rgba(212,175,55,0.5)]" />
                  <p className="text-xs leading-relaxed">Executive Growth Architect. Author. CMO. Speaker. Built on first principles, not favours.</p>
                </div>
                <div className="space-y-3">
                  <div className="text-xs font-bold text-brand-gold uppercase tracking-widest">Navigate</div>
                  {[['store.html', '🛍️ Digital Store'], ['resources.html', '🎁 Free Resources'], ['blog.html', '✍️ Growth Essays'], ['speaking.html', '💼 Consulting'], ['dashboard.html', '👤 Customer Dashboard']].map(([href, label]) => (
                    <a key={href} href={href} className="block text-xs hover:text-brand-gold transition-colors font-semibold">{label}</a>
                  ))}
                </div>
                <div className="space-y-3">
                  <div className="text-xs font-bold text-brand-gold uppercase tracking-widest">Work</div>
                  {[['index.html#impact', 'Impact Dashboard'], ['index.html#journey', 'My Journey'], ['media.html', 'Press & Media'], ['index.html#tv', 'Videos & Podcasts'], ['index.html#book', 'No Godfather Book']].map(([href, label]) => (
                    <a key={href} href={href} className="block text-xs hover:text-brand-gold transition-colors">{label}</a>
                  ))}
                </div>
                <div className="space-y-3">
                  <div className="text-xs font-bold text-brand-gold uppercase tracking-widest">Contact</div>
                  <a href="mailto:yash@meagarwalyash.com" className="block text-xs hover:text-brand-gold transition-colors">yash@meagarwalyash.com</a>
                  <div className="text-xs mt-2 text-zinc-500">Mumbai, India 🇮🇳</div>
                </div>
              </div>
              <div className="pt-6 border-t border-white/10 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs">
                <div>© 2026 Yash Agarwal (@MeAgarwalYash). All Rights Reserved.</div>
                <div className="text-brand-gold font-bold">MUMBAI, INDIA • LIVE IST</div>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<DashboardApp />);
  </script>
</body>
</html>
